<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#203247;--muted:#78899d;--line:#e2e9f1;--blue:#8bbcf2;--blue2:#dcecff;--green:#3aaa78;--red:#d35d69;--orange:#d99a43;--orange2:#fff3df;--purple:#795db8;--purple2:#f1ebff;--shadow:0 14px 40px rgba(45,62,86,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding-bottom:40px}
.shell{max-width:980px;margin:0 auto;padding:0 16px}.topbar{position:sticky;top:0;z-index:10;background:rgba(245,247,251,.94);backdrop-filter:blur(14px);display:flex;justify-content:space-between;align-items:center;padding:18px 0 10px}.eyebrow{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}.topbar h1{margin:2px 0 0;font-size:28px}
.sync-status-btn{border:1px solid var(--line);background:#fff;color:var(--text);height:42px;border-radius:14px;padding:0 12px;display:flex;align-items:center;gap:8px;font-weight:800}.sync-dot{width:8px;height:8px;border-radius:50%;background:#a9b4c1}.sync-status-btn[data-state="synced"] .sync-dot{background:var(--green)}.sync-status-btn[data-state="working"] .sync-dot,.sync-status-btn[data-state="pending"] .sync-dot{background:var(--orange)}.sync-status-btn[data-state="error"] .sync-dot,.sync-status-btn[data-state="offline"] .sync-dot{background:var(--red)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:6px;background:#eaf0f6;border-radius:17px;margin:4px 0 14px}.tabs button{border:0;background:transparent;padding:11px 7px;border-radius:12px;font:inherit;font-weight:850;color:#60758b;cursor:pointer}.tabs button.active{background:#fff;color:var(--text);box-shadow:0 5px 16px rgba(40,60,82,.08)}
.workspace{background:#fff;border:1px solid var(--line);border-radius:20px;padding:13px 14px;margin-bottom:12px;box-shadow:var(--shadow)}.workspace-row{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}.workspace-group{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:11px;color:var(--muted);font-weight:800}.field input,.field select{border:1px solid #d8e1eb;background:#fff;color:var(--text);border-radius:11px;padding:9px 10px;font:inherit}.month-title{font-size:18px;font-weight:900;margin:0}.mini{font-size:12px;color:var(--muted)}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 14px}.kpi{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:var(--shadow)}.kpi small{display:block;color:var(--muted);font-weight:750;margin-bottom:6px}.kpi strong{font-size:23px}.kpi.remain{background:linear-gradient(145deg,#eef7ff,#fff);border-color:#cfe4fa}.kpi.savings{background:linear-gradient(145deg,#effaf5,#fff);border-color:#d2eee0}.kpi.test{background:linear-gradient(145deg,#fff7e8,#fff);border-color:#f2d8aa}.kpi.advice{background:linear-gradient(145deg,var(--purple2),#fff);border-color:#ded3fa}
.section{background:#fff;border:1px solid var(--line);border-radius:23px;padding:17px;margin:13px 0;box-shadow:var(--shadow)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.section h2{font-size:18px;margin:0}.section p{font-size:12px;color:var(--muted);margin:4px 0 0}.list{display:flex;flex-direction:column;gap:8px}.money-row{display:grid;grid-template-columns:minmax(0,1fr) 120px 38px;gap:9px;align-items:center;padding:10px 11px;border:1px solid var(--line);border-radius:15px;background:#fbfcfe}.money-row.recurring{grid-template-columns:30px minmax(0,1fr) 120px}.money-row.off{opacity:.48;background:#f5f6f8}.money-row label{font-weight:760;min-width:0}.money-row input[type=number]{width:100%;border:1px solid #d9e1eb;background:#fff;border-radius:11px;padding:9px 10px;font:inherit;text-align:right;color:var(--text)}.money-row input[type=checkbox]{width:19px;height:19px;accent-color:var(--blue)}
.remove{border:0;background:#fff1f2;color:var(--red);width:34px;height:34px;border-radius:10px;font-size:17px;cursor:pointer}.btn{border:0;border-radius:12px;padding:9px 12px;font:inherit;font-weight:820;cursor:pointer}.btn.primary{background:var(--blue);color:#183751}.btn.soft{background:var(--blue2);color:#285276}.btn.green{background:#dff4e8;color:#236847}.btn.ghost{background:#f3f6f9;color:#53677e}.btn.warn{background:var(--orange2);color:#865f27}.btn.danger{background:#fff0f1;color:#a7414d}.btn.purple{background:var(--purple2);color:#5c438f}.btn.small{padding:7px 9px;font-size:12px}.total-line{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-weight:850}.total-line strong{font-size:19px}
.save-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.save-card{border:1px solid var(--line);border-radius:17px;padding:14px;background:#fbfcfe}.save-card small{display:block;color:var(--muted);margin-bottom:5px}.save-card strong{font-size:24px}.save-form{display:flex;gap:7px;margin-top:10px}.save-form input{flex:1;min-width:0;border:1px solid #d9e1eb;background:#fff;border-radius:11px;padding:10px;font:inherit;text-align:right}.history{margin-top:12px;display:flex;flex-direction:column;gap:7px}.history-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:#f7f9fc;font-size:12px}.history-actions{display:flex;align-items:center;gap:7px}.positive{color:var(--green)}.negative{color:var(--red)}.notice{padding:12px 13px;border-radius:14px;background:#eef7ff;color:#45647f;border:1px solid #d4e7f9;font-size:12px}.notice.test-note{background:var(--orange2);border-color:#efd6aa;color:#7f5b28;margin-bottom:12px;font-weight:700}.notice.advice-note{background:var(--purple2);border-color:#ded3fa;color:#5d4887;margin-bottom:12px}
.test-list{display:flex;gap:8px;overflow:auto;padding:2px 0 10px}.test-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-weight:780;color:#60758b;white-space:nowrap;cursor:pointer}.test-chip.active{background:var(--orange2);border-color:#efd6aa;color:#805c28}.empty{padding:28px;text-align:center;color:var(--muted)}
.plan-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.plan-grid .field{background:#fbfcfe;border:1px solid var(--line);border-radius:14px;padding:11px}.plan-result{margin-top:12px;padding:14px;border-radius:17px;background:#f7f4ff;border:1px solid #e2d9fb}.plan-result strong{font-size:25px}.projection{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px}.projection-row{display:flex;justify-content:space-between;padding:8px 10px;background:#fff;border:1px solid var(--line);border-radius:10px;font-size:12px}
.advice-box{padding:16px;border:1px solid #dfd5f8;background:#faf8ff;border-radius:18px}.advice-box h3{margin:0 0 7px}.advice-big{font-size:29px;font-weight:900;margin:4px 0}.advice-lines{display:grid;gap:8px;margin-top:12px}.advice-line{display:flex;justify-content:space-between;gap:12px;padding:9px 11px;border-radius:11px;background:#fff;border:1px solid var(--line)}
.modal{width:min(520px,calc(100% - 24px));border:1px solid var(--line);border-radius:23px;background:#fff;color:var(--text);padding:0;box-shadow:0 30px 90px rgba(0,0,0,.18)}.modal::backdrop{background:rgba(24,36,52,.35);backdrop-filter:blur(4px)}.modal-inner{padding:19px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0;font-size:20px}.close{border:0;background:#f2f5f8;width:35px;height:35px;border-radius:10px}.modal-body{margin-top:13px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}
@media(max-width:760px){.summary{grid-template-columns:1fr 1fr}.save-grid{grid-template-columns:1fr}.plan-grid{grid-template-columns:1fr 1fr}.kpi strong{font-size:21px}.topbar h1{font-size:24px}}
@media(max-width:540px){.shell{padding:0 11px}.tabs button{font-size:12px;padding:10px 4px}.section{padding:13px;border-radius:19px}.money-row{grid-template-columns:minmax(0,1fr) 102px 34px;padding:8px}.money-row.recurring{grid-template-columns:26px minmax(0,1fr) 102px}.workspace{padding:11px}.workspace-group{width:100%}.workspace-group .field{flex:1}.workspace-group input,.workspace-group select{width:100%}.sync-status-btn{width:42px;padding:0;justify-content:center}.sync-status-btn span:last-child{display:none}.form-grid,.plan-grid,.projection{grid-template-columns:1fr}}
</style>

<body>
<div class="shell">
<header class="topbar"><div><div class="eyebrow">Κοινά οικονομικά</div><h1>Μαζί</h1></div><button class="sync-status-btn" id="syncStatusButton" type="button"><span class="sync-dot"></span><span id="syncStatusText">Σύνδεση</span></button></header>
<div class="tabs"><button id="tabReal" class="active" type="button">🏠 Κύκλος</button><button id="tabTest" type="button">🔮 Πρόβλεψη</button><button id="tabAdvice" type="button">💍 Γάμος</button><button id="tabStats" type="button">📊 Στατιστικά</button><button id="tabGifts" type="button">⚙️ Εργαλεία</button></div>
<main id="app"></main>
</div>
<dialog id="modal" class="modal"></dialog>
<script>
const storeKey='mazi-budget-v2';
const euro=n=>new Intl.NumberFormat('el-GR',{style:'currency',currency:'EUR'}).format(Number(n||0));
const isoToday=()=>new Date().toISOString().slice(0,10), monthNow=()=>isoToday().slice(0,7);
const monthLabel=k=>{const d=new Date(k+'-01T12:00:00');return d.toLocaleDateString('el-GR',{month:'long',year:'numeric'})};
const esc=s=>String(s==null?'':s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const uid=()=> 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);

const incomeBase=[['i1','Μισθός Μάνου',1136],['i2','Τηλεργασία',23],['i3','Ticket Restaurant',100],['i4','Ενοίκιο',250],['i5','Extra εργασία',200],['i6','Μισθός Πένυς',850]];
const expenseBase=[['e1','Δάνειο Πένυ',157],['e2','Δάνειο αυτοκινήτου',168],['e3','Δάνειο επίπλων',98],['e4','Πιστωτική κάρτα',70.83],['e5','COSMOTE',50],['e6','Νύχια',50],['e7','Ασφάλεια αυτοκινήτου',35],['e8','Λαϊκή',50],['e9','Κρέατα',50],['e10','Βενζίνη',100],['e11','Γιατρός Μάνου',80],['e12','Γιατρός Πένυς',35],['e13','Καφέδες',50],['e14','Τσιγάρα Μάνος',150],['e15','Τσιγάρα Πένυ',150],['e16','Supermarket',325],['e17','Προσωπικά Μάνου',100],['e18','Προσωπικά Πένυ',100],['e19','ΔΕΗ',0],['e20','ΕΥΔΑΠ',0],['e21','Κοινόχρηστα',0]];

function baseMonth(key,source){
 const inc=source?.incomes?.map(x=>({id:x.id,name:x.name,amount:Number(x.amount||0)}))||incomeBase.map(x=>({id:x[0],name:x[1],amount:x[2]}));
 const exp=source?.expenses?.map(x=>({id:x.id,name:x.name,amount:Number(x.amount||0),active:true,payDay:x.payDay||'',remind:x.remind!==false,variable:x.variable===true,actualKnown:x.variable===true?false:true,actualEnteredAt:'',actualHistory:[]}))||expenseBase.map(x=>({id:x[0],name:x[1],amount:x[2],active:true,payDay:'',remind:true,variable:x[0]==='e19',actualKnown:x[0]==='e19'?false:true,actualEnteredAt:'',actualHistory:[]}));
 return {key,calculationDate:key+'-25',incomes:inc,expenses:exp,extraIncomes:[],extraExpenses:[]};
}
const defaults={schema:6,activeMonth:monthNow(),months:{},savingsTx:[],tests:[],activeTestId:null,longPlan:null,advice:null};
defaults.months[defaults.activeMonth]=baseMonth(defaults.activeMonth);

function sum(a){return (a||[]).reduce((s,x)=>s+Number(x.amount||0),0)}
function normalizeTx(tx,key){return {...tx,id:tx.id||uid(),date:tx.date||isoToday(),monthKey:tx.monthKey||key,label:tx.label||'Κίνηση',reason:tx.reason||'',amount:Number(tx.amount||0)}}
function normalizeState(raw){
 if(raw&&raw.schema===6){
   raw.months=raw.months||{};raw.activeMonth=raw.activeMonth||Object.keys(raw.months)[0]||monthNow();
   if(!raw.months[raw.activeMonth])raw.months[raw.activeMonth]=baseMonth(raw.activeMonth);
   raw.savingsTx=(raw.savingsTx||[]).map(x=>normalizeTx(x,raw.activeMonth));
   raw.tests=Array.isArray(raw.tests)?raw.tests:[];raw.longPlan=raw.longPlan||null;raw.advice=raw.advice||null;
   return raw;
 }
 const out=structuredClone(defaults);
 if(!raw||typeof raw!=='object')return out;
 if(raw.schema===5){
   out.activeMonth=raw.activeMonth||monthNow();out.months=raw.months||{};if(!out.months[out.activeMonth])out.months[out.activeMonth]=baseMonth(out.activeMonth);
   out.tests=Array.isArray(raw.tests)?raw.tests:[];out.activeTestId=raw.activeTestId||null;
   out.savingsTx=(raw.savingsTx||[]).map(x=>normalizeTx(x,out.activeMonth));
   const txTotal=sum(out.savingsTx),legacy=Number(raw.savings||0),diff=legacy-txTotal;
   if(Math.abs(diff)>0.005)out.savingsTx.push({id:uid(),date:isoToday(),monthKey:out.activeMonth,label:'Μεταφορά υπολοίπου',reason:'Μεταφορά από προηγούμενη έκδοση',amount:diff});
   return out;
 }
 const key=(raw.calculationDate||isoToday()).slice(0,7);out.activeMonth=key;const m=baseMonth(key);
 const oldInc=Array.isArray(raw.incomes)?raw.incomes:[];m.incomes.forEach(i=>{const x=oldInc.find(o=>o.id===i.id||o.name===i.name);if(x)i.amount=Number(x.amount||0)});
 const oldExp=Array.isArray(raw.expenses)?raw.expenses:[];m.expenses.forEach(e=>{const x=oldExp.find(o=>o.id===e.id||o.name===e.name);if(x)e.amount=Number(x.amount!=null?x.amount:(x.actual!=null?x.actual:(x.planned||0)))});
 m.extraIncomes=Array.isArray(raw.extraIncomes)?raw.extraIncomes:[];m.extraExpenses=Array.isArray(raw.extraExpenses)?raw.extraExpenses:[];m.calculationDate=raw.calculationDate||key+'-01';out.months={[key]:m};
 out.savingsTx=(raw.savingsTx||[]).map(x=>normalizeTx(x,key));const legacy=Number(raw.savings||0),txTotal=sum(out.savingsTx),diff=legacy-txTotal;if(Math.abs(diff)>0.005)out.savingsTx.push({id:uid(),date:isoToday(),monthKey:key,label:'Υπόλοιπο έναρξης',reason:'Μεταφορά από προηγούμενη έκδοση',amount:diff});
 return out;
}
window.maziNormalizeState=normalizeState;
function load(){try{return normalizeState(JSON.parse(localStorage.getItem(storeKey)))}catch{return normalizeState(null)}}
let state=load(),view='real';
function save(){localStorage.setItem(storeKey,JSON.stringify(state));if(window.maziSyncChanged)window.maziSyncChanged()}
function curMonth(){if(!state.months[state.activeMonth])state.months[state.activeMonth]=baseMonth(state.activeMonth);return state.months[state.activeMonth]}
function monthIncome(m){return sum(m.incomes)+sum(m.extraIncomes)}
function monthExpense(m){return (m.expenses||[]).filter(x=>x.active!==false).reduce((s,x)=>s+Number(x.amount||0),0)+sum(m.extraExpenses)}
function monthSavingsNet(key){return (state.savingsTx||[]).filter(x=>x.monthKey===key).reduce((s,x)=>s+Number(x.amount||0),0)}
function balanceThroughMonth(key){return (state.savingsTx||[]).filter(x=>(x.monthKey||'0000-00')<=key).reduce((s,x)=>s+Number(x.amount||0),0)}
function balanceBeforeMonth(key){return (state.savingsTx||[]).filter(x=>(x.monthKey||'0000-00')<key).reduce((s,x)=>s+Number(x.amount||0),0)}
function monthRemain(m){return monthIncome(m)-monthExpense(m)-monthSavingsNet(m.key)}
function fmtDate(d){if(!d)return '—';return new Date(d+'T12:00:00').toLocaleDateString('el-GR',{day:'2-digit',month:'2-digit',year:'numeric'})}
function activeTest(){return state.tests.find(x=>x.id===state.activeTestId)||null}
function testIncome(t){return sum(t.incomes)+sum(t.extraIncomes)}
function testExpense(t){return (t.expenses||[]).filter(x=>x.active!==false).reduce((s,x)=>s+Number(x.amount||0),0)+sum(t.extraExpenses)}
function cloneForTest(m){return {id:uid(),title:'Τεστ '+new Date().toLocaleString('el-GR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}),date:isoToday(),sourceMonth:m.key,incomes:structuredClone(m.incomes),expenses:structuredClone(m.expenses),extraIncomes:structuredClone(m.extraIncomes),extraExpenses:structuredClone(m.extraExpenses),plannedSavings:0}}

function render(){for(const id of ['Real','Test','Advice'])document.getElementById('tab'+id).classList.toggle('active',view===id.toLowerCase());document.getElementById('app').innerHTML=view==='real'?realView():view==='test'?testView():adviceView();bind()}
function monthOptions(){return Object.keys(state.months).sort().reverse().map(k=>'<option value="'+k+'" '+(k===state.activeMonth?'selected':'')+'>'+esc(monthLabel(k))+'</option>').join('')}
function incomeRow(x,kind,test,fixed){const p=test?'t':'r',del=fixed?'':'<button class="remove" data-remove="'+p+'-'+kind+'" data-id="'+x.id+'">×</button>';return '<div class="money-row '+(fixed?'recurring':'')+'" style="'+(fixed?'grid-template-columns:minmax(0,1fr) 120px':'')+'"><label>'+esc(x.name)+'</label><input type="number" min="0" step="0.01" value="'+Number(x.amount||0)+'" data-money="'+p+'-'+kind+'" data-id="'+x.id+'">'+del+'</div>'}
function recurringRow(x,test){const p=test?'t':'r';return '<div class="money-row recurring '+(x.active===false?'off':'')+'"><input type="checkbox" '+(x.active===false?'':'checked')+' data-toggle="'+p+'-expense" data-id="'+x.id+'"><label>'+esc(x.name)+'</label><input type="number" min="0" step="0.01" value="'+Number(x.amount||0)+'" data-money="'+p+'-expense" data-id="'+x.id+'"></div>'}
function extraExpenseRow(x,test){
 const p=test?'t':'r';
 if(test)return '<div class="money-row"><label>'+esc(x.name)+'</label><input type="number" min="0" step="0.01" value="'+Number(x.amount||0)+'" data-money="'+p+'-extraExpense" data-id="'+x.id+'"><button class="remove" data-remove="'+p+'-extraExpense" data-id="'+x.id+'">×</button></div>';
 const pending=x.status!=='paid';
 const method=x.method||'Άλλο';
 const when=x.dueDate?fmtDate(x.dueDate):'στην πληρωμή';
 return '<div class="oneoff-row '+(pending?'pending':'paid')+'"><div class="oneoff-main"><div class="oneoff-title"><strong>'+esc(x.name)+'</strong><span class="oneoff-badge '+(pending?'owe':'done')+'">'+(pending?'Οφειλή':'Πληρώθηκε')+'</span></div><div class="oneoff-meta">'+esc(method)+' · '+esc(when)+(x.date?' · έγινε '+esc(fmtDate(x.date)):'')+'</div></div><input type="number" min="0" step="0.01" value="'+Number(x.amount||0)+'" data-money="r-extraExpense" data-id="'+x.id+'"><button class="btn small '+(pending?'warn':'ghost')+'" data-mark-paid="'+x.id+'">'+(pending?'Πληρώθηκε':'Ξανά οφειλή')+'</button><button class="remove" data-remove="r-extraExpense" data-id="'+x.id+'">×</button></div>';
}

function realView(){
 const m=curMonth(),inc=monthIncome(m),exp=monthExpense(m),prior=balanceBeforeMonth(m.key),net=monthSavingsNet(m.key),bal=balanceThroughMonth(m.key),rem=monthRemain(m);
 const hist=(state.savingsTx||[]).filter(x=>x.monthKey===m.key).slice().reverse();
 return '<section class="workspace"><div class="workspace-row"><div><div class="mini">Ενεργός μήνας</div><h2 class="month-title">'+esc(monthLabel(m.key))+'</h2></div><div class="workspace-group"><div class="field"><label>Μήνας</label><select id="monthSelect">'+monthOptions()+'</select></div><button class="btn soft" id="newMonth">+ Νέος μήνας</button><button class="btn danger" id="deleteMonth">Διαγραφή μήνα</button><div class="field"><label>Έναρξη κύκλου</label><input id="calcDate" type="date" value="'+esc(m.calculationDate||'')+'"></div></div></div></section>'+

function projectionRows(start,monthly,n){let s='';for(let i=1;i<=n;i++)s+='<div class="projection-row"><span>Μήνας '+i+'</span><strong>'+euro(start+monthly*i)+'</strong></div>';return s}

 const t=activeTest(),p=ensureLongPlan(),start=balanceThroughMonth(state.activeMonth),surplus=Number(p.income||0)-Number(p.expenses||0),end=start+surplus*Math.max(1,Number(p.months||1));

 else{const inc=testIncome(t),exp=testExpense(t),before=inc-exp,after=before-Number(t.plannedSavings||0),chips=state.tests.slice().reverse().map(x=>'<button class="test-chip '+(x.id===t.id?'active':'')+'" data-open-test="'+x.id+'">'+esc(x.title)+'</button>').join('');

 '<section class="summary"><div class="kpi test"><small>Έσοδα τεστ</small><strong>'+euro(inc)+'</strong></div><div class="kpi test"><small>Έξοδα τεστ</small><strong>'+euro(exp)+'</strong></div><div class="kpi test"><small>Πριν την υποθετική άκρη</small><strong>'+euro(before)+'</strong></div><div class="kpi test"><small>Τελικό υπόλοιπο</small><strong class="'+(after<0?'negative':'')+'">'+euro(after)+'</strong></div></section>'+
 '<section class="section"><div class="section-head"><div><h2>Έσοδα Τεστ</h2><p>Μόνο υποθετικά.</p></div><button class="btn warn" data-add="t-income">+ Άλλο</button></div><div class="list">'+t.incomes.map(x=>incomeRow(x,'income',true,true)).join('')+t.extraIncomes.map(x=>incomeRow(x,'extraIncome',true,false)).join('')+'</div></section>'+

function ensureAdvice(){if(!state.advice){const m=curMonth(),start=balanceThroughMonth(state.activeMonth);state.advice={target:start+2000,months:10,income:monthIncome(m),expenses:monthExpense(m),buffer:100}}if(state.advice.buffer==null)state.advice.buffer=100;return state.advice}
function adviceView(){
 const a=ensureAdvice(),start=balanceThroughMonth(state.activeMonth),months=Math.max(1,Number(a.months||1)),income=Number(a.income||0),expenses=Number(a.expenses||0),target=Number(a.target||0),need=Math.max(0,target-start),req=need/months,maxExp=income-req,currentSurplus=income-expenses,projected=start+currentSurplus*months,cut=Math.max(0,expenses-maxExp);
 let msg='';
 if(target<=start)msg='Ο στόχος έχει ήδη καλυφθεί με το ποσό που υπάρχει στην άκρη.';
 else if(maxExp<0)msg='Ο στόχος απαιτεί μεγαλύτερη μηνιαία αποταμίευση από ολόκληρο το εισόδημα. Χρειάζεται μεγαλύτερος χρόνος ή επιπλέον έσοδο.';
 else if(cut<=0)msg='Με τα σημερινά λογικά έξοδα, ο στόχος βγαίνει χωρίς επιπλέον περικοπή.';
 else msg='Για να πιαστεί ο στόχος με αυτά τα έσοδα, χρειάζεται περίπου '+euro(cut)+' λιγότερα έξοδα τον μήνα ή ισόποση αύξηση εσόδων.';
 return '<div class="notice advice-note">Η Συμβουλευτική είναι αριθμητικό πλάνο πάνω στα δικά σου ποσά. Δεν πειράζει πραγματικές κινήσεις.</div>'+
 '<section class="section"><div class="section-head"><div><h2>Στόχος αποταμίευσης</h2><p>Διάλεξε πόσα θέλεις να έχεις συνολικά στην άκρη και σε πόσους μήνες.</p></div><button class="btn purple small" id="adviceFromMonth">Πάρε ποσά από ενεργό μήνα</button></div><div class="plan-grid"><div class="field"><label>Στόχος συνολικά στην άκρη</label><input id="goalTarget" type="number" min="0" step="0.01" value="'+target+'"></div><div class="field"><label>Σε πόσους μήνες</label><input id="goalMonths" type="number" min="1" max="120" value="'+months+'"></div><div class="field"><label>Μέσο μηνιαίο εισόδημα</label><input id="goalIncome" type="number" min="0" step="0.01" value="'+income+'"></div><div class="field"><label>Λογικά μηνιαία έξοδα τώρα</label><input id="goalExpenses" type="number" min="0" step="0.01" value="'+expenses+'"></div></div></section>'+
 '<section class="summary"><div class="kpi advice"><small>Έχεις ήδη</small><strong>'+euro(start)+'</strong></div><div class="kpi advice"><small>Χρειάζεσαι ακόμη</small><strong>'+euro(need)+'</strong></div><div class="kpi advice"><small>Αποταμίευση / μήνα</small><strong>'+euro(req)+'</strong></div><div class="kpi advice"><small>Μέγιστα έξοδα / μήνα</small><strong class="'+(maxExp<0?'negative':'')+'">'+euro(maxExp)+'</strong></div></section>'+
 '<section class="section"><div class="advice-box"><h3>Πρακτική εικόνα</h3><div class="advice-big">'+euro(projected)+'</div><div class="mini">Με τα σημερινά ποσά, περίπου τόσα θα είχες μετά από '+months+' μήνες.</div><div class="advice-lines"><div class="advice-line"><span>Τωρινό μηνιαίο περίσσευμα</span><strong>'+euro(currentSurplus)+'</strong></div><div class="advice-line"><span>Ανώτατο όριο εξόδων για τον στόχο</span><strong>'+euro(maxExp)+'</strong></div><div class="advice-line"><span>Προτεινόμενη μείωση εξόδων</span><strong class="'+(cut>0?'negative':'positive')+'">'+euro(cut)+'</strong></div></div><div class="notice advice-note" style="margin:12px 0 0">'+esc(msg)+'</div></div></section>';
}

function bind(){
 document.getElementById('tabReal').onclick=()=>{view='real';render()};document.getElementById('tabTest').onclick=()=>{view='test';render()};document.getElementById('tabAdvice').onclick=()=>{view='advice';render()};
 const m=curMonth(),ms=document.getElementById('monthSelect');if(ms)ms.onchange=e=>{state.activeMonth=e.target.value;save();render()};
 const cd=document.getElementById('calcDate');if(cd)cd.onchange=e=>{m.calculationDate=e.target.value||m.key+'-25';save()};
 const nm=document.getElementById('newMonth');if(nm)nm.onclick=openNewMonth;const dm=document.getElementById('deleteMonth');if(dm)dm.onclick=deleteMonth;
 document.querySelectorAll('[data-money]').forEach(x=>x.onchange=()=>changeMoney(x));document.querySelectorAll('[data-toggle]').forEach(x=>x.onchange=()=>toggleRecurring(x));document.querySelectorAll('[data-remove]').forEach(x=>x.onclick=()=>removeExtra(x));document.querySelectorAll('[data-add]').forEach(x=>x.onclick=()=>addExtra(x.dataset.add));document.querySelectorAll('[data-mark-paid]').forEach(x=>x.onclick=()=>toggleOneOffPaid(x.dataset.markPaid));
 document.querySelectorAll('[data-remove-saving]').forEach(x=>x.onclick=()=>removeSaving(x.dataset.removeSaving));
 const sm=document.getElementById('saveMoney');if(sm)sm.onclick=putSavings;const tm=document.getElementById('takeMoney');if(tm)tm.onclick=takeSavings;
 const nt=document.getElementById('newTest');if(nt)nt.onclick=createTest;const rt=document.getElementById('removeTest');if(rt)rt.onclick=removeTest;document.querySelectorAll('[data-open-test]').forEach(b=>b.onclick=()=>{state.activeTestId=b.dataset.openTest;save();render()});
 const td=document.getElementById('testDate');if(td)td.onchange=e=>{const t=activeTest();if(t){t.date=e.target.value||isoToday();save()}};const ps=document.getElementById('plannedSavings');if(ps)ps.onchange=e=>{const t=activeTest();if(t){t.plannedSavings=Math.max(0,Number(e.target.value||0));save();render()}};
 for(const [id,key] of [['planMonths','months'],['planIncome','income'],['planExpenses','expenses'],['planBuffer','buffer']]){const el=document.getElementById(id);if(el)el.onchange=e=>{const p=ensureLongPlan();p[key]=Math.max(key==='months'?1:0,Number(e.target.value||0));save();render()}}
 const pf=document.getElementById('planFromMonth');if(pf)pf.onclick=()=>{state.longPlan=longPlanDefaults();save();render()};
 for(const [id,key] of [['goalTarget','target'],['goalMonths','months'],['goalIncome','income'],['goalExpenses','expenses'],['goalBuffer','buffer']]){const el=document.getElementById(id);if(el)el.onchange=e=>{const a=ensureAdvice();a[key]=Math.max(key==='months'?1:0,Number(e.target.value||0));save();render()}}
 const af=document.getElementById('adviceFromMonth');if(af)af.onclick=()=>{const mm=curMonth(),start=balanceThroughMonth(state.activeMonth),old=ensureAdvice();state.advice={target:old.target||start+2000,months:old.months||10,income:monthIncome(mm),expenses:monthExpense(mm),buffer:old.buffer==null?100:old.buffer};save();render()};
}
function target(prefix){const test=prefix[0]==='t',kind=prefix.slice(2),o=test?activeTest():curMonth();return o?{o,kind}:null}
function arr(o,k){return k==='income'?o.incomes:k==='expense'?o.expenses:k==='extraIncome'?o.extraIncomes:o.extraExpenses}
function changeMoney(inp){const p=target(inp.dataset.money);if(!p)return;const x=arr(p.o,p.kind).find(v=>v.id===inp.dataset.id);if(x)x.amount=Math.max(0,Number(inp.value||0));save();render()}
function toggleRecurring(inp){const p=target(inp.dataset.toggle);if(!p)return;const x=arr(p.o,p.kind).find(v=>v.id===inp.dataset.id);if(x)x.active=inp.checked;save();render()}
function removeExtra(b){const p=target(b.dataset.remove);if(!p)return;const a=arr(p.o,p.kind),i=a.findIndex(x=>x.id===b.dataset.id);if(i>=0)a.splice(i,1);save();render()}
function showModal(title,body,onSave,label='Αποθήκευση'){const d=document.getElementById('modal');d.innerHTML='<form class="modal-inner" id="modalForm"><div class="modal-head"><h2>'+esc(title)+'</h2><button class="close" type="button" id="modalClose">×</button></div><div class="modal-body">'+body+'</div><div class="modal-footer"><button class="btn ghost" type="button" id="modalCancel">Άκυρο</button><button class="btn primary" type="submit">'+esc(label)+'</button></div></form>';d.showModal();const close=()=>d.close();document.getElementById('modalClose').onclick=close;document.getElementById('modalCancel').onclick=close;document.getElementById('modalForm').onsubmit=e=>{e.preventDefault();if(onSave(new FormData(e.currentTarget))===false)return;d.close();save();render()}}
function addExtra(code){
 const test=code[0]==='t',kind=code.slice(2),o=test?activeTest():curMonth();if(!o)return;
 const isIncome=kind==='income';
 if(!test&&!isIncome){
   const due=o.calculationDate||o.key+'-25';
   showModal('Έξοδο μόνο για '+monthLabel(o.key),'<div class="form-grid"><div class="field"><label>Τι αγοράσαμε / χρωστάμε</label><input name="name" required placeholder="π.χ. Klarna παπούτσια"></div><div class="field"><label>Ποσό</label><input name="amount" type="number" min="0" step="0.01" required></div><div class="field"><label>Έγινε στις</label><input name="date" type="date" value="'+isoToday()+'"></div><div class="field"><label>Θα πληρωθεί</label><input name="dueDate" type="date" value="'+esc(due)+'"></div><div class="field"><label>Τρόπος</label><select name="method"><option>Klarna</option><option>Χρεωστική / Τράπεζα</option><option>Μετρητά</option><option>Πιστωτική</option><option>Άλλο</option></select></div></div><div class="notice" style="margin-top:10px">Θα υπολογιστεί αμέσως στα έξοδα αυτού του μήνα και θα εμφανίζεται ως <strong>Οφειλή</strong> μέχρι να πατήσεις «Πληρώθηκε». Δεν θα περάσει αυτόματα στον επόμενο μήνα. Αν το ποσό είναι ήδη μέσα στην «Πιστωτική», μην το βάλεις δεύτερη φορά εδώ.</div>',fd=>{
     o.extraExpenses.push({id:uid(),name:String(fd.get('name')||'Άλλο').trim(),amount:Number(fd.get('amount')||0),date:String(fd.get('date')||isoToday()),dueDate:String(fd.get('dueDate')||due),method:String(fd.get('method')||'Άλλο'),status:'pending'});
   },'Προσθήκη οφειλής');
   return;
 }
 showModal(isIncome?'Άλλο έσοδο':'Άλλο έξοδο','<div class="form-grid"><div class="field"><label>Περιγραφή</label><input name="name" required></div><div class="field"><label>Ποσό</label><input name="amount" type="number" min="0" step="0.01" required></div></div>',fd=>{(isIncome?o.extraIncomes:o.extraExpenses).push({id:uid(),name:String(fd.get('name')||'Άλλο').trim(),amount:Number(fd.get('amount')||0)})},'Προσθήκη');
}
function toggleOneOffPaid(id){const x=curMonth().extraExpenses.find(v=>v.id===id);if(!x)return;x.status=x.status==='paid'?'pending':'paid';save();render()}
function openNewMonth(){showModal('Νέος μήνας','<div class="field"><label>Μήνας</label><input name="month" type="month" required value="'+monthNow()+'"></div><div class="notice" style="margin-top:10px">Θα πάρει τα ποσά των πάγιων και εσόδων από τον τωρινό μήνα, αλλά όλα τα πάγια θα ξεκινήσουν ενεργά και τα έκτακτα θα είναι κενά.</div>',fd=>{const k=String(fd.get('month')||'');if(!k)return false;if(!state.months[k])state.months[k]=baseMonth(k,curMonth());state.activeMonth=k},'Άνοιγμα μήνα')}
function deleteMonth(){const keys=Object.keys(state.months);if(keys.length<=1){alert('Χρειάζεται να μείνει τουλάχιστον ένας μήνας.');return}const k=state.activeMonth;if(!confirm('Να διαγραφεί ο '+monthLabel(k)+'; Θα διαγραφούν και οι κινήσεις της Άκρης που ανήκουν σε αυτόν τον μήνα, οπότε τα υπόλοιπα των επόμενων μηνών θα επανυπολογιστούν.'))return;delete state.months[k];state.savingsTx=state.savingsTx.filter(x=>x.monthKey!==k);state.activeMonth=Object.keys(state.months).sort().reverse()[0];save();render()}
function putSavings(){const inp=document.getElementById('saveAmount'),a=Math.max(0,Number(inp.value||0)),m=curMonth();if(!a)return;if(a>monthRemain(m)){alert('Το ποσό είναι μεγαλύτερο από όσα μένουν αυτόν τον μήνα.');return}state.savingsTx.push({id:uid(),date:isoToday(),monthKey:m.key,label:'Στην άκρη',reason:'',amount:a});save();render()}
function takeSavings(){const m=curMonth(),available=balanceThroughMonth(m.key);showModal('Αφαίρεση από την άκρη','<div class="form-grid"><div class="field"><label>Ποσό</label><input name="amount" type="number" min="0" max="'+available+'" step="0.01" required></div><div class="field"><label>Λόγος</label><input name="reason" required placeholder="π.χ. έκτακτη επισκευή"></div></div><div class="notice" style="margin-top:10px">Διαθέσιμα έως αυτόν τον μήνα: <strong>'+euro(available)+'</strong></div>',fd=>{const a=Math.max(0,Number(fd.get('amount')||0));if(!a||a>available){alert('Το ποσό δεν είναι διαθέσιμο στην άκρη έως αυτόν τον μήνα.');return false}state.savingsTx.push({id:uid(),date:isoToday(),monthKey:m.key,label:'Από την άκρη',reason:String(fd.get('reason')||'').trim(),amount:-a})},'Αφαίρεση')}
function savingsValid(txs){const by={};for(const x of txs){const k=x.monthKey||'0000-00';by[k]=(by[k]||0)+Number(x.amount||0)}let bal=0;for(const k of Object.keys(by).sort()){bal+=by[k];if(bal<-0.005)return false}return true}
function removeSaving(id){const tx=(state.savingsTx||[]).find(x=>x.id===id);if(tx&&(tx.commonSpendId||tx.personalMoveId)){alert('Αυτή η κίνηση είναι συνδεδεμένη με καταχωρημένη δαπάνη. Άλλαξε την πηγή ή διέγραψε τη δαπάνη από την αντίστοιχη ενότητα.');return}const candidate=state.savingsTx.filter(x=>x.id!==id);if(!savingsValid(candidate)){alert('Δεν γίνεται να διαγραφεί αυτή η κίνηση γιατί θα έκανε την Άκρη αρνητική σε επόμενο μήνα.');return}state.savingsTx=candidate;save();render()}
function createTest(){const t=cloneForTest(curMonth());state.tests.push(t);state.activeTestId=t.id;save();view='test';render()}
function removeTest(){const t=activeTest();if(!t||!confirm('Να αφαιρεθεί αυτό το τεστ;'))return;state.tests=state.tests.filter(x=>x.id!==t.id);state.activeTestId=state.tests.length?state.tests[state.tests.length-1].id:null;save();render()}
render();
</script>
