function load(){try{const s=JSON.parse(localStorage.getItem(storeKey));return s?deepMerge(structuredClone(defaults),s):structuredClone(defaults)}catch{return structuredClone(defaults)}}
function deepMerge(base,override){if(Array.isArray(base))return Array.isArray(override)?override:base;if(base&&typeof base==='object'){for(const k of Object.keys(base)){if(override?.[k]!==undefined)base[k]=deepMerge(base[k],override[k])}for(const k of Object.keys(override||{})){if(base[k]===undefined)base[k]=override[k]}return base}return override??base}
function save(){localStorage.setItem(storeKey,JSON.stringify(state));if(window.maziSyncChanged)window.maziSyncChanged();}
function wallet(id){return state.wallets.find(w=>w.id===id)}
function availableNow(){return state.wallets.reduce((s,w)=>s+Number(w.balance||0),0)}
function totalExpectedIncome(){return state.incomes.reduce((s,i)=>s+Number(i.amount||0),0)}
function receivedIncome(){return state.incomes.filter(i=>i.status==='received').reduce((s,i)=>s+Number(i.amount||0),0)}
function expenseTotal(e){return e.status==='inactive'?0:Number(e.actual||e.planned||0)}
function spentAmount(e){const total=expenseTotal(e);if(e.spent!==undefined&&e.spent!==null)return Math.max(0,Number(e.spent||0));return e.status==='paid'?total:0}
function remainingExpense(e){return Math.max(0,expenseTotal(e)-spentAmount(e))}
function plannedExpenses(){return state.expenses.reduce((s,e)=>s+expenseTotal(e),0)+state.cardExtra.reduce((s,x)=>s+Number(x.amount||0),0)}
function paidExpenses(){return state.expenses.reduce((s,e)=>s+spentAmount(e),0)+state.cardExtra.filter(x=>x.status==='paid').reduce((s,x)=>s+Number(x.amount||0),0)}
function pendingExpenses(){return state.expenses.reduce((s,e)=>s+remainingExpense(e),0)+state.cardExtra.filter(x=>x.status!=='paid').reduce((s,x)=>s+Number(x.amount||0),0)}
function spendableNow(){return availableNow()-pendingExpenses()}
function forecastMonth(){return totalExpectedIncome()-plannedExpenses()}
function allocationTotal(){return Number(state.allocation?.savings||0)+Number(state.allocation?.other||0)}
function unallocated(){return forecastMonth()-allocationTotal()}
function iconFor(cat){return ({'Δάνεια':'🏦','Κάρτα':'💳','Λογαριασμοί':'📱','Αυτοκίνητο':'🚗','Τρόφιμα':'🛒','Υγεία':'🩺','Καθημερινά':'☕','Προσωπικά':'👤','Περιοδικά':'🧾'})[cat]||'•'}
function fmtDate(d){if(!d)return 'χωρίς λήξη';const x=new Date(d+'T12:00:00');return x.toLocaleDateString('el-GR',{day:'2-digit',month:'2-digit'})}
function fmtDateLong(d){if(!d)return '';const x=new Date(d+'T12:00:00');return x.toLocaleDateString('el-GR',{day:'2-digit',month:'2-digit',year:'numeric'})}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}

 return `<div class="row clickable" data-action="edit-expense" data-id="${e.id}"><div class="row-left"><div class="row-icon">${iconFor(e.category)}</div><div><div class="row-title">${esc(e.name)}</div><div class="row-sub">${esc(e.category)}${e.note?' · '+esc(e.note):''}</div>${progress}${dates}</div></div><div class="row-right"><strong>${e.status==='inactive'?'—':euro(total)}</strong><span class="pill ${remaining===0&&e.status!=='inactive'?'paid':e.status==='inactive'?'expected':'pending'}">${e.status==='inactive'?'Ανενεργό':remaining===0?'Πληρώθηκε':partial?'Μερικώς':'Εκκρεμεί'}</span></div></div>`

function personalView(){return `<div class="notice">Τα προσωπικά πορτοφόλια είναι ξεχωριστά από τα κοινά. Το «Από κοινά» μεταφέρει πραγματικά χρήματα από το κοινό ταμείο. Το «Έξτρα έσοδο» είναι μόνο για χρήματα που ήρθαν απ' έξω, όπως κέρδος, δώρο ή επιστροφή.</div><div class="grid grid-2" style="margin-top:14px">${personalCard('manos',state.personal.manos)}${personalCard('penny',state.personal.penny)}</div>`}

function calcForecast(){const f=state.forecast;const income=f.income.reduce((a,b)=>a+Number(b||0),0)+Number(f.extrasIncome||0);let exp=state.expenses.filter(e=>!['ΔΕΗ','ΕΥΔΑΠ','Κοινόχρηστα'].includes(e.name)).reduce((s,e)=>s+Number(f.expenseOverrides[e.id]??e.planned??0),0);exp+=Number(f.dei||0)+Number(f.eydap||0)+Number(f.koinoxrista||0)+Number(f.extrasExpense||0);return{income,exp,left:income-exp}}
function forecastView(){const r=calcForecast();return `<div class="notice">Sandbox: ό,τι αλλάζεις εδώ δεν πειράζει τον τρέχοντα μήνα. Είναι μόνο για να βλέπεις περίπου πώς βγαίνει ο επόμενος.</div><div class="section-head"><h2>Σενάριο επόμενου μήνα</h2><button class="btn secondary small" data-action="forecast-reset">Επαναφορά</button></div><section class="forecast-result"><div class="stat"><small>Έσοδα</small><strong class="amount-pos">${euro(r.income)}</strong></div><div class="stat"><small>Έξοδα</small><strong class="amount-neg">${euro(r.exp)}</strong></div><div class="stat"><small>Πιθανό υπόλοιπο</small><strong class="${r.left>=0?'amount-pos':'amount-neg'}">${r.left>=0?'+':''}${euro(r.left)}</strong></div></section><div class="section-head"><h2>Μεταβλητά / έκτακτα</h2></div><section class="card"><div class="form-grid"><div class="field"><label>ΔΕΗ</label><input data-forecast="dei" type="number" step="0.01" value="${state.forecast.dei}"></div><div class="field"><label>ΕΥΔΑΠ</label><input data-forecast="eydap" type="number" step="0.01" value="${state.forecast.eydap}"></div><div class="field"><label>Κοινόχρηστα</label><input data-forecast="koinoxrista" type="number" step="0.01" value="${state.forecast.koinoxrista}"></div><div class="field"><label>Έκτακτο έσοδο</label><input data-forecast="extrasIncome" type="number" step="0.01" value="${state.forecast.extrasIncome}"></div><div class="field"><label>Έκτακτο έξοδο</label><input data-forecast="extrasExpense" type="number" step="0.01" value="${state.forecast.extrasExpense}"></div></div></section><div class="section-head"><h2>Προσαρμογή παγίων</h2></div><section class="card"><div class="list">${state.expenses.filter(e=>!['ΔΕΗ','ΕΥΔΑΠ','Κοινόχρηστα'].includes(e.name)).map(e=>`<div class="row"><div class="row-left"><div class="row-icon">${iconFor(e.category)}</div><div><div class="row-title">${esc(e.name)}</div><div class="row-sub">Βάση ${euro(e.planned)}</div></div></div><div class="inline-edit"><input type="number" step="0.01" data-forecast-expense="${e.id}" value="${state.forecast.expenseOverrides[e.id]??e.planned}"></div></div>`).join('')}</div></section>`}

function bind(){
 document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>{screen=b.dataset.screen;render()});

 document.querySelectorAll('[data-forecast]').forEach(inp=>inp.oninput=()=>{state.forecast[inp.dataset.forecast]=Number(inp.value||0);save();render()});
 document.querySelectorAll('[data-forecast-expense]').forEach(inp=>inp.oninput=()=>{state.forecast.expenseOverrides[inp.dataset.forecastExpense]=Number(inp.value||0);save();render()});

function showModal(title,body,onSave,saveText='Αποθήκευση'){
 const d=document.getElementById('modal');
 d.innerHTML=`<form class="modal-inner" id="modalForm" novalidate><div class="modal-head"><h2>${title}</h2><button type="button" class="close" data-modal-cancel>×</button></div>${body}<div class="modal-footer"><button type="button" class="btn secondary" data-modal-cancel>Άκυρο</button><button type="button" class="btn" id="modalSave">${saveText}</button></div></form>`;
 const form=d.querySelector('#modalForm');
 d.querySelectorAll('[data-modal-cancel]').forEach(btn=>btn.addEventListener('click',()=>d.close('cancel')));
 d.querySelector('#modalSave').addEventListener('click',()=>{
   const required=[...form.querySelectorAll('[required]')];
   const invalid=required.find(el=>!String(el.value??'').trim());
   if(invalid){invalid.focus();alert('Συμπλήρωσε πρώτα τα υποχρεωτικά πεδία.');return;}
   try{
     const result=onSave(new FormData(form));
     if(result===false)return;
     save();
     d.close('saved');
     render();
   }catch(err){
     console.error('Αποτυχία αποθήκευσης',err);
     alert('Δεν αποθηκεύτηκε η αλλαγή. Δοκίμασε ξανά.');
   }
 });
 form.addEventListener('submit',e=>{e.preventDefault();d.querySelector('#modalSave').click()});
 d.oncancel=e=>{e.preventDefault();d.close('cancel')};
 d.showModal();
}

function walletOptions(selected=''){return state.wallets.map(w=>`<option value="${w.id}" ${w.id===selected?'selected':''}>${esc(w.owner)} · ${esc(w.name)} (${euro(w.balance)})</option>`).join('')}
function action(type,data={}){
 if(type==='add-income')return editIncome(null);
 if(type==='edit-income')return editIncome(state.incomes.find(i=>i.id===data.id));
 if(type==='add-expense')return editExpense(null);
 if(type==='edit-expense')return editExpense(state.expenses.find(e=>e.id===data.id));
 if(type==='add-card')return addCard();
 if(type==='adjust-wallet')return adjustWallet(data.id);
 if(type==='setup-balances')return setupBalances();
 if(type==='initial-setup')return initialSetup();
 if(type==='dash-toggle'){
   if(!state.dashboard)state.dashboard={sections:{}};
   if(!state.dashboard.sections)state.dashboard.sections={};
   state.dashboard.sections[data.id]=dashboardMode(data.id)==='collapsed'?'open':'collapsed';
   save();return render();
 }
 if(type==='edit-allocation')return editAllocation();
 if(type==='savings-deposit')return savingsMove(1);
 if(type==='savings-withdraw')return savingsMove(-1);
 if(type==='personal-fund')return fundPersonalFromShared(data.person);
 if(type==='personal-add')return personalMove(data.person,1);
 if(type==='personal-spend')return personalMove(data.person,-1);
 if(type==='personal-transfer')return personalTransfer(data.person);
 if(type==='delete-savings-tx')return deleteSavingsTx(Number(data.index));
 if(type==='delete-personal-tx')return deletePersonalTx(data.person,Number(data.index));
 if(type==='forecast-reset'){state.forecast=structuredClone(defaults.forecast);save();return render()}
}

function editIncome(i){const isNew=!i;i=i||{id:'i'+Date.now(),name:'',amount:0,expectedWindow:'',status:'expected',wallet:'mbank',type:'extra',note:''};showModal(isNew?'Νέο έσοδο':'Επεξεργασία εσόδου',`<div class="form-grid"><div class="field"><label>Περιγραφή</label><input name="name" required value="${esc(i.name)}" placeholder="π.χ. Κέρδος / Δώρο / Επιστροφή"></div><div class="field"><label>Ποσό</label><input name="amount" type="number" step="0.01" required value="${i.amount}"></div><div class="field"><label>Πότε αναμένεται</label><input name="expectedWindow" value="${esc(i.expectedWindow||'')}"></div><div class="field"><label>Κατάσταση</label><select name="status"><option value="expected" ${i.status==='expected'?'selected':''}>Αναμένεται</option><option value="received" ${i.status==='received'?'selected':''}>Μπήκε</option></select></div><div class="field" style="grid-column:1/-1"><label>Πού μπήκε</label><select name="wallet">${walletOptions(i.wallet)}</select></div><div class="field" style="grid-column:1/-1"><label>Σχόλιο / από πού προήλθε</label><textarea name="note" placeholder="π.χ. κέρδος από στοίχημα, δώρο γενεθλίων, πώληση αντικειμένου...">${esc(i.note||'')}</textarea></div></div>`,fd=>{
   const oldStatus=i.status,oldAmt=Number(i.amount||0),oldWallet=i.wallet; const newStatus=fd.get('status'),newAmt=Number(fd.get('amount')||0),newWallet=fd.get('wallet');
   if(!isNew&&i.posted&&oldStatus==='received'){wallet(oldWallet).balance-=oldAmt;i.posted=false}
   Object.assign(i,{name:fd.get('name'),amount:newAmt,expectedWindow:fd.get('expectedWindow'),status:newStatus,wallet:newWallet,note:fd.get('note')||''});
   if(newStatus==='received'&&!i.posted){wallet(newWallet).balance+=newAmt;i.posted=true;state.activity.push({date:today,label:`Έσοδο: ${i.name}`,amount:newAmt})}
   if(newStatus!=='received')i.posted=false;
   if(isNew)state.incomes.push(i);
 })}

function editExpense(e){
 const isNew=!e;
 e=e||{id:'e'+Date.now(),name:'',planned:0,actual:0,spent:0,spentApplied:0,status:'pending',category:'Άλλο',recurring:'once',due:'',wallet:'mbank'};
 const totalNow=expenseTotal(e);
 const spentNow=spentAmount(e);
 const remainingNow=remainingExpense(e);
 showModal(isNew?'Νέο έξοδο':'Επεξεργασία εξόδου',`<div class="form-grid">
   <div class="field"><label>Περιγραφή</label><input name="name" required value="${esc(e.name)}"></div>
   <div class="field"><label>Συνολικό budget</label><input name="actual" type="number" min="0" step="0.01" required value="${totalNow}"></div>
   <div class="field"><label>Έχουν ήδη ξοδευτεί</label><input name="spentCorrection" type="number" min="0" step="0.01" value="${spentNow}"></div>
   <div class="field"><label>Μένουν</label><input type="text" id="remainingReadonly" value="${euro(remainingNow)}" readonly></div>
   <div class="field"><label>Νέα κίνηση τώρα</label><input name="newSpend" type="number" min="0" step="0.01" value="0" placeholder="π.χ. 80"></div>
   <div class="field"><label>Κατηγορία</label><input name="category" value="${esc(e.category||'Άλλο')}"></div>
   <div class="field"><label>Λήξη για υπενθύμιση</label><input name="due" type="date" value="${e.due||''}"></div>
   <div class="field"><label>Κατάσταση</label><select name="status"><option value="pending" ${e.status==='pending'?'selected':''}>Εκκρεμεί / μερικώς</option><option value="paid" ${e.status==='paid'?'selected':''}>Πληρώθηκε όλο</option><option value="inactive" ${e.status==='inactive'?'selected':''}>Δεν έχει έρθει ακόμα</option></select></div>
   <div class="field"><label>Η νέα κίνηση βγαίνει από</label><select name="wallet">${walletOptions(e.wallet||'mbank')}</select></div>
   <div class="field" style="grid-column:1/-1"><label>Σημείωση</label><textarea name="note" placeholder="π.χ. τσιγάρα μήνα / λογαριασμός / αγορά για σπίτι">${esc(e.note||'')}</textarea></div>
 </div>
 <div class="notice" id="expenseRemainingPreview" style="margin-top:12px"></div>`,fd=>{
   const oldTotal=expenseTotal(e);
   const oldSpent=spentAmount(e);
   const total=Math.max(0,Number(fd.get('actual')||0));
   const selectedStatus=fd.get('status');
   let correctedSpent=Math.max(0,Number(fd.get('spentCorrection')||0));
   let newSpend=Math.max(0,Number(fd.get('newSpend')||0));
   const newWallet=fd.get('wallet')||'mbank';

   if(total<correctedSpent-0.001){
     alert(`Το συνολικό budget δεν μπορεί να είναι μικρότερο από όσα έχουν ήδη ξοδευτεί (${euro(correctedSpent)}).`);
     return false;
   }
   if(selectedStatus==='inactive'){
     if(correctedSpent>0||newSpend>0){
       alert('Έξοδο με ήδη καταχωρημένες κινήσεις δεν μπορεί να γίνει ανενεργό.');
       return false;
     }
     correctedSpent=0;
     newSpend=0;
   }
   if(selectedStatus==='paid'){
     newSpend=Math.max(0,total-correctedSpent);
   }
   if(correctedSpent+newSpend>total+0.001){
     alert(`Η νέα κίνηση είναι μεγαλύτερη από το υπόλοιπο του εξόδου. Απομένουν ${euro(Math.max(0,total-correctedSpent))}.`);
     return false;
   }

   const w=wallet(newWallet)||wallet('mbank');
   if(newSpend>0){
     if(!w){alert('Δεν βρέθηκε το πορτοφόλι πληρωμής.');return false;}
     if(Number(w.balance||0)<newSpend){
       alert(`Το πορτοφόλι έχει ${euro(w.balance)} και η κίνηση είναι ${euro(newSpend)}.`);
       return false;
     }
     w.balance-=newSpend;
   }

   const newSpent=correctedSpent+newSpend;
   const finalStatus=selectedStatus==='inactive'?'inactive':(total>0&&newSpent>=total-0.001?'paid':'pending');
   Object.assign(e,{
     name:fd.get('name'),
     actual:total,
     planned:isNew?total:(e.planned||total),
     spent:newSpent,
     spentApplied:newSpent,
     category:fd.get('category'),
     due:fd.get('due')||'',
     status:finalStatus,
     wallet:newWallet,
     note:fd.get('note')||'',
     posted:newSpent>0
   });

   if(Math.abs(correctedSpent-oldSpent)>0.001){
     state.activity.push({
       date:today,
       label:`Διόρθωση ξοδεμένου: ${e.name} · ${euro(oldSpent)} → ${euro(correctedSpent)}`,
       amount:0,
       expenseId:e.id
     });
   }
   if(newSpend>0){
     state.activity.push({
       date:today,
       label:`${newSpent>=total?'Πληρωμή':'Μερική κίνηση'}: ${e.name}`,
       amount:-newSpend,
       expenseId:e.id,
       wallet:newWallet
     });
   }
   if(isNew)state.expenses.push(e);
 });
 const d=document.getElementById('modal');
 const totalInput=d.querySelector('[name="actual"]');
 const spentCorrectionInput=d.querySelector('[name="spentCorrection"]');
 const newSpendInput=d.querySelector('[name="newSpend"]');
 const statusInput=d.querySelector('[name="status"]');
 const preview=d.querySelector('#expenseRemainingPreview');
 const remainingReadonly=d.querySelector('#remainingReadonly');
 const refreshPreview=()=>{
   const total=Math.max(0,Number(totalInput?.value||0));
   let corrected=Math.max(0,Number(spentCorrectionInput?.value||0));
   let add=Math.max(0,Number(newSpendInput?.value||0));
   const st=statusInput?.value;
   if(st==='paid')add=Math.max(0,total-corrected);
   if(st==='inactive'){
     if(remainingReadonly)remainingReadonly.value=euro(0);
     preview.innerHTML='Το έξοδο είναι σε αναμονή και <strong>δεν δεσμεύει χρήματα</strong> ακόμη.';
     return;
   }
   const after=Math.min(total,corrected+add);
   const rem=Math.max(0,total-after);
   if(remainingReadonly)remainingReadonly.value=euro(rem);
   const correctionNote=Math.abs(corrected-spentNow)>0.001?' Η αλλαγή στο «Έχουν ήδη ξοδευτεί» διορθώνει μόνο την καταγραφή και δεν αφαιρεί ξανά χρήματα από το πορτοφόλι.':'';
   preview.innerHTML=`Μετά τη νέα κίνηση θα έχουν ξοδευτεί <strong>${euro(after)}</strong> και θα απομένουν <strong>${euro(rem)}</strong>. Η «Νέα κίνηση τώρα» αφαιρείται από το επιλεγμένο κοινό πορτοφόλι.${correctionNote} Η αποταμίευση δεν επηρεάζεται.`;
 };
 [totalInput,spentCorrectionInput,newSpendInput,statusInput].forEach(x=>x&&x.addEventListener('input',refreshPreview));
 refreshPreview();
}
function adjustWallet(id){const w=wallet(id);showModal('Διόρθωση υπολοίπου',`<div class="notice">Γράψε το πραγματικό ποσό που βλέπεις τώρα. Η διαφορά θα καταγραφεί ως διόρθωση ώστε το app να συμφωνεί με την πραγματικότητα.</div><div class="field" style="margin-top:14px"><label>${esc(w.owner)} · ${esc(w.name)}</label><input name="balance" type="number" step="0.01" value="${w.balance}" required></div><div class="field" style="margin-top:12px"><label>Σημείωση (προαιρετικό)</label><input name="note" placeholder="π.χ. χειροκίνητος έλεγχος τράπεζας"></div>`,fd=>{const next=Number(fd.get('balance')||0),diff=next-w.balance;w.balance=next;state.activity.push({date:today,label:`Διόρθωση ${w.owner} · ${w.name}${fd.get('note')?' — '+fd.get('note'):''}`,amount:diff})})}
function setupBalances(){showModal('Αρχικά / τρέχοντα υπόλοιπα',`<div class="notice">Βάλε ό,τι έχετε αυτή τη στιγμή. Τα λεφτά της «Άκρης» μένουν ξεχωριστά.</div><div class="form-grid" style="margin-top:14px">${state.wallets.map(w=>`<div class="field"><label>${esc(w.owner)} · ${esc(w.name)}</label><input name="${w.id}" type="number" step="0.01" value="${w.balance}"></div>`).join('')}<div class="field"><label>Στην άκρη</label><input name="savings" type="number" step="0.01" value="${state.savings}"></div></div>`,fd=>{state.wallets.forEach(w=>w.balance=Number(fd.get(w.id)||0));state.savings=Number(fd.get('savings')||0)})}
function initialSetup(){const active=state.expenses.filter(e=>e.status!=='inactive');showModal('Αρχική κατάσταση τρέχοντος μήνα',`<div class="notice"><strong>Μία φορά στην αρχή.</strong> Βάζεις τα πραγματικά σημερινά υπόλοιπα και σημειώνεις τι έχει ήδη συμβεί. Τα τσεκαρισμένα έσοδα/έξοδα θεωρούνται ήδη μέσα στα υπόλοιπα που γράφεις, άρα δεν θα προστεθούν ή αφαιρεθούν ξανά.</div><h3 class="setup-title">1. Τι έχετε τώρα</h3><div class="form-grid">${state.wallets.map(w=>`<div class="field"><label>${esc(w.owner)} · ${esc(w.name)}</label><input name="wallet_${w.id}" type="number" step="0.01" value="${w.balance}"></div>`).join('')}<div class="field"><label>Στην άκρη</label><input name="setup_savings" type="number" step="0.01" value="${state.savings}"></div><div class="field"><label>Προσωπικά Μάνου</label><input name="personal_manos" type="number" step="0.01" value="${state.personal.manos.balance}"></div><div class="field"><label>Προσωπικά Πένυς</label><input name="personal_penny" type="number" step="0.01" value="${state.personal.penny.balance}"></div></div><h3 class="setup-title">2. Έσοδα που έχουν ήδη μπει</h3><div class="setup-list">${state.incomes.map(i=>`<label class="setup-item"><input type="checkbox" name="recv_${i.id}" ${i.status==='received'?'checked':''}><span><strong>${esc(i.name)}</strong><small>Πραγματικό ποσό</small></span><input class="setup-amount" name="incamt_${i.id}" type="number" step="0.01" value="${i.amount}"></label>`).join('')}</div><h3 class="setup-title">3. Πάγια που έχουν ήδη πληρωθεί</h3><div class="setup-list">${active.map(e=>`<label class="setup-item"><input type="checkbox" name="paid_${e.id}" ${e.status==='paid'?'checked':''}><span><strong>${esc(e.name)}</strong><small>Πραγματικό ποσό</small></span><input class="setup-amount" name="expamt_${e.id}" type="number" step="0.01" value="${e.actual||e.planned||0}"></label>`).join('')}</div><div class="warning notice" style="margin-top:14px">ΔΕΗ, ΕΥΔΑΠ και κοινόχρηστα που δεν έχουν έρθει ακόμα τα αφήνεις όπως είναι και τα καταχωρείς όταν εμφανιστούν.</div>`,fd=>{state.wallets.forEach(w=>w.balance=Number(fd.get('wallet_'+w.id)||0));state.savings=Number(fd.get('setup_savings')||0);state.personal.manos.balance=Number(fd.get('personal_manos')||0);state.personal.penny.balance=Number(fd.get('personal_penny')||0);state.incomes.forEach(i=>{i.amount=Number(fd.get('incamt_'+i.id)||i.amount||0);const received=fd.has('recv_'+i.id);i.status=received?'received':'expected';i.posted=received});active.forEach(e=>{e.actual=Number(fd.get('expamt_'+e.id)||e.actual||e.planned||0);const paid=fd.has('paid_'+e.id);e.status=paid?'paid':'pending';e.spent=paid?e.actual:0;e.posted=paid});state.setupComplete=true;state.activity.push({date:today,label:'Ολοκληρώθηκε η αρχική κατάσταση',amount:0})},'Αποθήκευση αρχικής κατάστασης')}
function editAllocation(){const rem=forecastMonth();if(rem<=0)return alert('Δεν υπάρχει θετικό υπόλοιπο για μοίρασμα αυτή τη στιγμή.');const a=state.allocation||{savings:0,other:0,otherLabel:'Άλλο / ελεύθερα'};showModal('Μοίρασμα υπολοίπου',`<div class="notice">Μετά από όλα τα έσοδα και τα προγραμματισμένα έξοδα μένουν <strong>${euro(rem)}</strong>. Διάλεξε πόσα θέλετε να προγραμματίσετε για την άκρη και πόσα για κάτι άλλο.</div><div class="form-grid" style="margin-top:14px"><div class="field"><label>Στην άκρη</label><input name="saveAmount" type="number" min="0" step="0.01" value="${a.savings||0}"></div><div class="field"><label>Για άλλο / ελεύθερα</label><input name="otherAmount" type="number" min="0" step="0.01" value="${a.other||0}"></div><div class="field" style="grid-column:1/-1"><label>Πώς να το ονομάσουμε</label><input name="otherLabel" value="${esc(a.otherLabel||'Άλλο / ελεύθερα')}" placeholder="π.χ. αγορά για σπίτι / βόλτες / ελεύθερα"></div></div><div class="mini muted" style="margin-top:10px">Αν αφήσεις μέρος αδιάθετο, θα παραμείνει ως διαθέσιμο υπόλοιπο του μήνα.</div>`,fd=>{const sav=Math.max(0,Number(fd.get('saveAmount')||0)),other=Math.max(0,Number(fd.get('otherAmount')||0));if(sav+other>rem+0.001)return alert(`Το μοίρασμα είναι ${euro(sav+other)}, αλλά το διαθέσιμο υπόλοιπο είναι ${euro(rem)}.`),false;state.allocation={savings:sav,other,otherLabel:fd.get('otherLabel')||'Άλλο / ελεύθερα'}})}

function addCard(){showModal('Έκτακτη χρήση πιστωτικής',`<div class="form-grid"><div class="field"><label>Περιγραφή</label><input name="label" required placeholder="π.χ. αγορά για σπίτι"></div><div class="field"><label>Ποσό</label><input name="amount" type="number" step="0.01" required></div></div><div class="warning notice" style="margin-top:12px">Θα θεωρηθεί δεσμευμένο έξοδο του τρέχοντος κύκλου μέχρι να εξοφληθεί.</div>`,fd=>state.cardExtra.push({label:fd.get('label'),amount:Number(fd.get('amount')||0),date:today,status:'pending'}))}
function savingsMove(sign){showModal(sign>0?'Κατάθεση στην άκρη':'Ανάληψη από την άκρη',`<div class="form-grid"><div class="field"><label>Ποσό</label><input name="amount" type="number" step="0.01" required></div><div class="field"><label>${sign>0?'Από πού':'Πού θα μπουν'}</label><select name="wallet">${walletOptions('mbank')}</select></div><div class="field" style="grid-column:1/-1"><label>Αιτιολογία</label><input name="label" required placeholder="π.χ. περίσσευμα μήνα / έκτακτο έξοδο"></div></div>`,fd=>{const amt=Number(fd.get('amount')||0)*sign,w=wallet(fd.get('wallet'));if(sign>0&&w.balance<Math.abs(amt))return alert('Το συγκεκριμένο πορτοφόλι δεν έχει αρκετό διαθέσιμο υπόλοιπο.'),false;if(sign<0&&state.savings<Math.abs(amt))return alert('Δεν υπάρχουν αρκετά χρήματα στην άκρη.'),false;state.savings+=amt;w.balance-=amt;state.savingsTx.push({id:'s'+Date.now()+Math.random().toString(36).slice(2,7),date:today,amount:amt,label:fd.get('label'),wallet:w.id})})}
function fundPersonalFromShared(person){
 const p=state.personal[person];
 const expenseName=person==='manos'?'Προσωπικά Μάνου':'Προσωπικά Πένυ';
 const budgetExpense=state.expenses.find(e=>e.name===expenseName);
 const total=budgetExpense?expenseTotal(budgetExpense):0;
 const already=budgetExpense?spentAmount(budgetExpense):0;
 const remaining=Math.max(0,total-already);
 showModal(`Από κοινά → ${p.name}`,`
   <div class="notice">Αυτό είναι η κανονική μεταφορά από το κοινό budget προς το προσωπικό πορτοφόλι. Θα μειώσει τα κοινά διαθέσιμα και θα αυξήσει το προσωπικό υπόλοιπο.</div>
   <div class="form-grid" style="margin-top:14px">
     <div class="field"><label>Ποσό</label><input name="amount" type="number" min="0" step="0.01" value="${remaining>0?remaining:100}" required></div>
     <div class="field"><label>Από ποιο κοινό πορτοφόλι</label><select name="wallet">${walletOptions('mbank')}</select></div>
     <div class="field" style="grid-column:1/-1"><label>Σημείωση</label><input name="label" value="Προσωπικά ${p.name}"></div>
   </div>
   ${budgetExpense?`<div class="mini muted" style="margin-top:10px">Budget προσωπικών: ${euro(total)} · έχουν δοθεί ${euro(already)} · απομένουν ${euro(remaining)}</div>`:''}
 `,fd=>{
   const amt=Math.max(0,Number(fd.get('amount')||0));
   const w=wallet(fd.get('wallet'));
   if(!w||amt<=0)return false;
   if(w.balance<amt){alert('Το κοινό πορτοφόλι δεν έχει αρκετό διαθέσιμο υπόλοιπο.');return false;}
   w.balance-=amt;
   p.balance+=amt;
   if(budgetExpense){
     const before=spentAmount(budgetExpense);
     const after=Math.min(expenseTotal(budgetExpense),before+amt);
     budgetExpense.spent=after;
     budgetExpense.spentApplied=after;
     budgetExpense.posted=after>0;
     budgetExpense.status=after>=expenseTotal(budgetExpense)&&expenseTotal(budgetExpense)>0?'paid':'pending';
   }
   p.transactions.push({date:today,amount:amt,label:fd.get('label')||`Προσωπικά ${p.name}`,note:'Μεταφορά από κοινά',sourceWallet:w.id,commonFunding:true,budgetExpenseId:budgetExpense?.id||null});
   state.activity.push({date:today,label:`Από κοινά → ${p.name}`,amount:-amt});
 });
}
function personalMove(person,sign){const p=state.personal[person];showModal(`${sign>0?'Έξτρα έσοδο':'Έξοδο'} · ${p.name}`,`<div class="form-grid"><div class="field"><label>Ποσό</label><input name="amount" type="number" step="0.01" required></div><div class="field"><label>Περιγραφή</label><input name="label" required placeholder="${sign>0?'π.χ. Κέρδος / Δώρο / Επιστροφή':'π.χ. Στοίχημα / Αγορά'}"></div><div class="field" style="grid-column:1/-1"><label>Σχόλιο / λόγος (προαιρετικό)</label><textarea name="note" placeholder="${sign>0?'π.χ. κέρδος από στοίχημα Ολυμπιακός - Ρεάλ':'π.χ. αγορά ακουστικών'}"></textarea></div></div>`,fd=>{const amt=Math.abs(Number(fd.get('amount')||0))*sign;if(sign<0&&p.balance<Math.abs(amt))return alert('Το προσωπικό υπόλοιπο δεν επαρκεί.'),false;p.balance+=amt;p.transactions.push({date:today,amount:amt,label:fd.get('label'),note:fd.get('note')||''})})}
function personalTransfer(person){const p=state.personal[person];showModal(`Μεταφορά από ${p.name} στο κοινό`, `<div class="form-grid"><div class="field"><label>Ποσό</label><input name="amount" type="number" step="0.01" required></div><div class="field"><label>Προορισμός</label><select name="dest"><option value="savings">Στην άκρη</option><option value="wallet">Κοινά μετρητά</option></select></div><div class="field" style="grid-column:1/-1"><label>Σημείωση</label><input name="label" value="Μεταφορά στο κοινό"></div></div>`,fd=>{const amt=Number(fd.get('amount')||0);if(amt>p.balance)return alert('Το προσωπικό υπόλοιπο δεν επαρκεί.'),false;p.balance-=amt;const dest=fd.get('dest');const tx={date:today,amount:-amt,label:fd.get('label'),transferDest:dest};if(dest==='savings'){state.savings+=amt;const sid='s'+Date.now()+Math.random().toString(36).slice(2,7);state.savingsTx.push({id:sid,date:today,amount:amt,label:`Από προσωπικό ${p.name}`,wallet:'homecash'});tx.linkedSavingsId=sid}else{wallet('homecash').balance+=amt;tx.destWallet='homecash'}p.transactions.push(tx)})}
function deleteSavingsTx(index){
 const tx=state.savingsTx[index]; if(!tx)return;
 if(!confirm(`Να διαγραφεί η κίνηση «${tx.label}» (${euro(tx.amount)});`))return;
 const w=wallet(tx.wallet);
 state.savings-=Number(tx.amount||0);
 if(w)w.balance+=Number(tx.amount||0);
 state.savingsTx.splice(index,1);
 save();render();
}
function deletePersonalTx(person,index){
 const p=state.personal[person],tx=p?.transactions?.[index]; if(!tx)return;
 if(!confirm(`Να διαγραφεί η κίνηση «${tx.label}» (${euro(tx.amount)});`))return;
 // Reverse the personal balance first.
 p.balance-=Number(tx.amount||0);
 if(tx.commonFunding){
   const w=wallet(tx.sourceWallet); if(w)w.balance+=Math.abs(Number(tx.amount||0));
   const be=state.expenses.find(e=>e.id===tx.budgetExpenseId);
   if(be){
     const next=Math.max(0,spentAmount(be)-Math.abs(Number(tx.amount||0)));
     be.spent=next;be.spentApplied=next;be.posted=next>0;
     be.status=next>=expenseTotal(be)&&expenseTotal(be)>0?'paid':'pending';
   }
 }else if(tx.transferDest==='savings'){
   state.savings-=Math.abs(Number(tx.amount||0));
   if(tx.linkedSavingsId){
     const si=state.savingsTx.findIndex(x=>x.id===tx.linkedSavingsId);
     if(si>=0)state.savingsTx.splice(si,1);
   }
 }else if(tx.transferDest==='wallet'){
   const w=wallet(tx.destWallet||'homecash'); if(w)w.balance-=Math.abs(Number(tx.amount||0));
 }
 p.transactions.splice(index,1);
 save();render();
}

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('./sw.js');
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            const ok = confirm('Υπάρχει νέα έκδοση της εφαρμογής. Να γίνει ενημέρωση τώρα;');
            if (ok) nw.postMessage({type:'SKIP_WAITING'});
          }
        });
      });
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        location.reload();
      });
    } catch (e) { console.warn('SW registration failed', e); }
  });
}
</script>
