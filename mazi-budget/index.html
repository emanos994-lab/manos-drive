  <script>
const euro = n => new Intl.NumberFormat('el-GR',{style:'currency',currency:'EUR'}).format(Number(n||0));
const today = new Date().toISOString().slice(0,10);
const storeKey='mazi-budget-v2';

const defaults={

    {id:'e14',name:'Τσιγάρα Μάνος',planned:150,actual:150,status:'pending',category:'Καθημερινά',recurring:'monthly',note:'100€ μπορούν να καλύπτονται με Ticket'},
    {id:'e15',name:'Τσιγάρα Πένυ',planned:150,actual:150,status:'pending',category:'Καθημερινά',recurring:'monthly'},

  personal:{
    manos:{name:'Μάνος',balance:0,transactions:[]},

  },

    income:[1136,23,100,250,200,850],

    extrasIncome:0,

let state=load(); let screen='home'; let expenseFilter='all';
function load(){try{const s=JSON.parse(localStorage.getItem(storeKey));return s?deepMerge(structuredClone(defaults),s):structuredClone(defaults)}catch{return structuredClone(defaults)}}
function deepMerge(base,override){if(Array.isArray(base))return Array.isArray(override)?override:base;if(base&&typeof base==='object'){for(const k of Object.keys(base)){if(override?.[k]!==undefined)base[k]=deepMerge(base[k],override[k])}for(const k of Object.keys(override||{})){if(base[k]===undefined)base[k]=override[k]}return base}return override??base}
function save(){localStorage.setItem(storeKey,JSON.stringify(state));}
function wallet(id){return state.wallets.find(w=>w.id===id)}
function availableNow(){return state.wallets.reduce((s,w)=>s+Number(w.balance||0),0)}
function totalExpectedIncome(){return state.incomes.reduce((s,i)=>s+Number(i.amount||0),0)}
function receivedIncome(){return state.incomes.filter(i=>i.status==='received').reduce((s,i)=>s+Number(i.amount||0),0)}
function plannedExpenses(){return state.expenses.filter(e=>e.status!=='inactive').reduce((s,e)=>s+Number(e.actual||e.planned||0),0)+state.cardExtra.reduce((s,x)=>s+Number(x.amount||0),0)}
function paidExpenses(){return state.expenses.filter(e=>e.status==='paid').reduce((s,e)=>s+Number(e.actual||0),0)+state.cardExtra.filter(x=>x.status==='paid').reduce((s,x)=>s+Number(x.amount||0),0)}
function pendingExpenses(){return plannedExpenses()-paidExpenses()}
function forecastMonth(){return totalExpectedIncome()-plannedExpenses()}
function allocationTotal(){return Number(state.allocation?.savings||0)+Number(state.allocation?.other||0)}
function unallocated(){return forecastMonth()-allocationTotal()}
function iconFor(cat){return ({'Δάνεια':'🏦','Κάρτα':'💳','Λογαριασμοί':'📱','Αυτοκίνητο':'🚗','Τρόφιμα':'🛒','Υγεία':'🩺','Καθημερινά':'☕','Προσωπικά':'👤','Περιοδικά':'🧾'})[cat]||'•'}
function fmtDate(d){if(!d)return 'χωρίς λήξη';const x=new Date(d+'T12:00:00');return x.toLocaleDateString('el-GR',{day:'2-digit',month:'2-digit'})}
function fmtDateLong(d){if(!d)return '';const x=new Date(d+'T12:00:00');return x.toLocaleDateString('el-GR',{day:'2-digit',month:'2-digit',year:'numeric'})}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}

const titles={home:'Αρχική',income:'Έσοδα',expenses:'Έξοδα',savings:'Στην άκρη',personal:'Προσωπικά',forecast:'Πρόβλεψη'};
function render(){document.getElementById('screenTitle').textContent=titles[screen];document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.toggle('active',b.dataset.screen===screen));const app=document.getElementById('app');app.innerHTML=({home:homeView,income:incomeView,expenses:expensesView,savings:savingsView,personal:personalView,forecast:forecastView})[screen]();bind();}

function homeView(){
 const avail=availableNow(), forecast=forecastMonth(); const expected=totalExpectedIncome(), exp=plannedExpenses();
 const dueSoon=state.expenses.filter(e=>e.due&&e.status!=='paid').sort((a,b)=>a.due.localeCompare(b.due)).slice(0,5);

   <div class="overview-side"><div class="mini-kpi"><small>Πρόβλεψη τέλους κύκλου</small><strong class="${forecast>=0?'amount-pos':'amount-neg'}">${forecast>=0?'+':''}${euro(forecast)}</strong><div class="mini muted">Έσοδα μείον όλα τα προγραμματισμένα έξοδα</div></div><div class="mini-kpi"><small>Εκκρεμούν να πληρωθούν</small><strong class="amount-warn">${euro(pendingExpenses())}</strong><div class="mini muted">Έχουν ήδη πληρωθεί ${euro(paidExpenses())}</div></div></div>

 <section class="stats"><div class="stat"><small>Αναμενόμενα έσοδα</small><strong>${euro(expected)}</strong></div><div class="stat"><small>Έχουν ήδη μπει</small><strong class="amount-pos">${euro(receivedIncome())}</strong></div><div class="stat"><small>Σύνολο εξόδων</small><strong>${euro(exp)}</strong></div><div class="stat"><small>Στην άκρη</small><strong style="color:#c9b8ff">${euro(state.savings)}</strong></div></section>${allocationCard()}

function incomeView(){return `<div class="notice">Τα ποσά και οι ημερομηνίες είναι προτεινόμενα. Κάθε μήνα μπορείς να αλλάξεις ποσό, πότε αναμένεται και σε ποιο πορτοφόλι μπήκε.</div><div class="section-head"><h2>Έσοδα κύκλου</h2><button class="btn" data-action="add-income">＋ Έκτακτο έσοδο</button></div><section class="card"><div class="list">${state.incomes.map(i=>`<div class="row clickable" data-action="edit-income" data-id="${i.id}"><div class="row-left"><div class="row-icon">${i.status==='received'?'✅':'💰'}</div><div><div class="row-title">${esc(i.name)}</div><div class="row-sub">${i.expectedWindow||'Χωρίς ημερομηνία'} · ${esc(wallet(i.wallet)?.name||'')}${i.note?' · '+esc(i.note):''}</div></div></div><div class="row-right"><strong>${euro(i.amount)}</strong><span class="pill ${i.status==='received'?'paid':'expected'}">${i.status==='received'?'Μπήκε':'Αναμένεται'}</span></div></div>`).join('')}</div></section><div class="section-head"><h2>Σύνοψη</h2></div><section class="stats"><div class="stat"><small>Σύνολο</small><strong>${euro(totalExpectedIncome())}</strong></div><div class="stat"><small>Έχουν μπει</small><strong class="amount-pos">${euro(receivedIncome())}</strong></div><div class="stat"><small>Αναμένονται</small><strong class="amount-warn">${euro(totalExpectedIncome()-receivedIncome())}</strong></div><div class="stat"><small>Διαθέσιμα τώρα</small><strong>${euro(availableNow())}</strong></div></section>`}

function expenseRow(e){
 const dates=[];
 if(e.issueDate)dates.push(`<span class="date-chip">📅 Έκδοση ${fmtDateLong(e.issueDate)}</span>`);
 if(e.due)dates.push(`<span class="date-chip">⏰ Λήξη ${fmtDateLong(e.due)}</span>`);
 if(e.paidDate)dates.push(`<span class="date-chip paid-date">✓ Πληρωμή ${fmtDateLong(e.paidDate)}</span>`);
 return `<div class="row clickable" data-action="edit-expense" data-id="${e.id}"><div class="row-left"><div class="row-icon">${iconFor(e.category)}</div><div><div class="row-title">${esc(e.name)}</div><div class="row-sub">${esc(e.category)}${e.note?' · '+esc(e.note):''}</div>${dates.length?`<div class="date-line">${dates.join('')}</div>`:''}</div></div><div class="row-right"><strong>${e.status==='inactive'?'—':euro(e.actual||e.planned)}</strong><span class="pill ${e.status==='paid'?'paid':e.status==='inactive'?'expected':'pending'}">${e.status==='paid'?'Πληρώθηκε':e.status==='inactive'?'Ανενεργό':'Εκκρεμεί'}</span></div></div>`
}

function savingsView(){return `<section class="card hero"><div class="muted">Συνολικά στην άκρη</div><div class="big" style="color:#b99cff">${euro(state.savings)}</div><div class="actions" style="margin-top:15px"><button class="btn green" data-action="savings-deposit">＋ Κατάθεση</button><button class="btn red" data-action="savings-withdraw">− Ανάληψη</button></div></section><div class="section-head"><h2>Ιστορικό αποταμίευσης</h2></div><section class="card"><div class="list">${state.savingsTx.length?state.savingsTx.slice().reverse().map(t=>`<div class="row"><div class="row-left"><div class="row-icon">${t.amount>0?'📥':'📤'}</div><div><div class="row-title">${esc(t.label)}</div><div class="row-sub">${fmtDate(t.date)} · ${esc(wallet(t.wallet)?.owner||'')} ${esc(wallet(t.wallet)?.name||'')}</div></div></div><div class="row-right"><strong class="${t.amount>0?'amount-pos':'amount-neg'}">${t.amount>0?'+':''}${euro(t.amount)}</strong></div></div>`).join(''):'<div class="empty">Δεν υπάρχει κίνηση ακόμα. Η πρώτη κατάθεση θα εμφανιστεί εδώ.</div>'}</div></section>`}

function personalCard(key,p){return `<section class="card"><div class="hero-row"><div><div class="muted">Προσωπικό ${p.name}</div><div class="big">${euro(p.balance)}</div></div><span class="badge blue">Ιδιωτικό πορτοφόλι</span></div><div class="actions" style="margin-top:14px"><button class="btn green small" data-action="personal-add" data-person="${key}">＋ Έσοδο</button><button class="btn red small" data-action="personal-spend" data-person="${key}">− Έξοδο</button><button class="btn secondary small" data-action="personal-transfer" data-person="${key}">↗ Στο κοινό</button></div><div class="divider"></div><div class="list">${p.transactions.slice().reverse().slice(0,6).map(t=>`<div class="row"><div class="row-left"><div class="row-icon">${t.amount>=0?'＋':'−'}</div><div><div class="row-title">${esc(t.label)}</div><div class="row-sub">${fmtDate(t.date)}${t.note?' · '+esc(t.note):''}</div></div></div><div class="row-right"><strong class="${t.amount>=0?'amount-pos':'amount-neg'}">${t.amount>=0?'+':''}${euro(t.amount)}</strong></div></div>`).join('')}</div></section>`}
function personalView(){return `<div class="notice">Τα προσωπικά πορτοφόλια είναι ξεχωριστά από τα κοινά. Μπορείς να δηλώνεις μόνο ό,τι θέλεις και να μεταφέρεις ποσό στην κοινή αποταμίευση όταν το αποφασίσεις.</div><div class="grid grid-2" style="margin-top:14px">${personalCard('manos',state.personal.manos)}${personalCard('penny',state.personal.penny)}</div>`}

function calcForecast(){const f=state.forecast;const income=f.income.reduce((a,b)=>a+Number(b||0),0)+Number(f.extrasIncome||0);let exp=state.expenses.filter(e=>!['ΔΕΗ','ΕΥΔΑΠ','Κοινόχρηστα'].includes(e.name)).reduce((s,e)=>s+Number(f.expenseOverrides[e.id]??e.planned??0),0);exp+=Number(f.dei||0)+Number(f.eydap||0)+Number(f.koinoxrista||0)+Number(f.extrasExpense||0);return{income,exp,left:income-exp}}
function forecastView(){const r=calcForecast();return `<div class="notice">Sandbox: ό,τι αλλάζεις εδώ δεν πειράζει τον τρέχοντα μήνα. Είναι μόνο για να βλέπεις περίπου πώς βγαίνει ο επόμενος.</div><div class="section-head"><h2>Σενάριο επόμενου μήνα</h2><button class="btn secondary small" data-action="forecast-reset">Επαναφορά</button></div><section class="forecast-result"><div class="stat"><small>Έσοδα</small><strong class="amount-pos">${euro(r.income)}</strong></div><div class="stat"><small>Έξοδα</small><strong class="amount-neg">${euro(r.exp)}</strong></div><div class="stat"><small>Πιθανό υπόλοιπο</small><strong class="${r.left>=0?'amount-pos':'amount-neg'}">${r.left>=0?'+':''}${euro(r.left)}</strong></div></section><div class="section-head"><h2>Μεταβλητά / έκτακτα</h2></div><section class="card"><div class="form-grid"><div class="field"><label>ΔΕΗ</label><input data-forecast="dei" type="number" step="0.01" value="${state.forecast.dei}"></div><div class="field"><label>ΕΥΔΑΠ</label><input data-forecast="eydap" type="number" step="0.01" value="${state.forecast.eydap}"></div><div class="field"><label>Κοινόχρηστα</label><input data-forecast="koinoxrista" type="number" step="0.01" value="${state.forecast.koinoxrista}"></div><div class="field"><label>Έκτακτο έσοδο</label><input data-forecast="extrasIncome" type="number" step="0.01" value="${state.forecast.extrasIncome}"></div><div class="field"><label>Έκτακτο έξοδο</label><input data-forecast="extrasExpense" type="number" step="0.01" value="${state.forecast.extrasExpense}"></div></div></section><div class="section-head"><h2>Προσαρμογή παγίων</h2></div><section class="card"><div class="list">${state.expenses.filter(e=>!['ΔΕΗ','ΕΥΔΑΠ','Κοινόχρηστα'].includes(e.name)).map(e=>`<div class="row"><div class="row-left"><div class="row-icon">${iconFor(e.category)}</div><div><div class="row-title">${esc(e.name)}</div><div class="row-sub">Βάση ${euro(e.planned)}</div></div></div><div class="inline-edit"><input type="number" step="0.01" data-forecast-expense="${e.id}" value="${state.forecast.expenseOverrides[e.id]??e.planned}"></div></div>`).join('')}</div></section>`}

function bind(){
 document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>{screen=b.dataset.screen;render()});
 document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{expenseFilter=b.dataset.filter;render()});
 document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset));
 document.querySelectorAll('[data-forecast]').forEach(inp=>inp.oninput=()=>{state.forecast[inp.dataset.forecast]=Number(inp.value||0);save();render()});
 document.querySelectorAll('[data-forecast-expense]').forEach(inp=>inp.oninput=()=>{state.forecast.expenseOverrides[inp.dataset.forecastExpense]=Number(inp.value||0);save();render()});
}

document.querySelectorAll('.bottom-nav button').forEach(b=>b.addEventListener('click',()=>{screen=b.dataset.screen;render()}));

function showModal(title,body,onSave,saveText='Αποθήκευση'){
 const d=document.getElementById('modal');
 d.innerHTML=`<form class="modal-inner" id="modalForm" novalidate><div class="modal-head"><h2>${title}</h2><button type="button" class="close" data-modal-cancel>×</button></div>${body}<div class="modal-footer"><button type="button" class="btn secondary" data-modal-cancel>Άκυρο</button><button type="button" class="btn" id="modalSave">${saveText}</button></div></form>`;
 const form=d.querySelector('#modalForm');
 d.querySelectorAll('[data-modal-cancel]').forEach(btn=>btn.addEventListener('click',()=>d.close('cancel')));
 d.querySelector('#modalSave').addEventListener('click',()=>{
   const required=[...form.querySelectorAll('[required]')];
   const invalid=required.find(el=>!String(el.value??'').trim());
   if(invalid){invalid.focus();alert('Συμπλήρωσε πρώτα τα υποχρεωτικά πεδία.');return;}
   try{
     const result=onSave(new FormData(form));
     if(result===false)return;
     save();
     d.close('saved');
     render();
   }catch(err){
     console.error('Αποτυχία αποθήκευσης',err);
     alert('Δεν αποθηκεύτηκε η αλλαγή. Δοκίμασε ξανά.');
   }
 });
 form.addEventListener('submit',e=>{e.preventDefault();d.querySelector('#modalSave').click()});
 d.oncancel=e=>{e.preventDefault();d.close('cancel')};
 d.showModal();
}

function walletOptions(selected=''){return state.wallets.map(w=>`<option value="${w.id}" ${w.id===selected?'selected':''}>${esc(w.owner)} · ${esc(w.name)} (${euro(w.balance)})</option>`).join('')}
function action(type,data={}){
 if(type==='add-income')return editIncome(null);
 if(type==='edit-income')return editIncome(state.incomes.find(i=>i.id===data.id));
 if(type==='add-expense')return editExpense(null);
 if(type==='edit-expense')return editExpense(state.expenses.find(e=>e.id===data.id));
 if(type==='add-card')return addCard();
 if(type==='adjust-wallet')return adjustWallet(data.id);
 if(type==='setup-balances')return setupBalances();
 if(type==='initial-setup')return initialSetup();
 if(type==='edit-allocation')return editAllocation();
 if(type==='savings-deposit')return savingsMove(1);
 if(type==='savings-withdraw')return savingsMove(-1);
 if(type==='personal-add')return personalMove(data.person,1);
 if(type==='personal-spend')return personalMove(data.person,-1);
 if(type==='personal-transfer')return personalTransfer(data.person);
 if(type==='forecast-reset'){state.forecast=structuredClone(defaults.forecast);save();return render()}
}

function editIncome(i){const isNew=!i;i=i||{id:'i'+Date.now(),name:'',amount:0,expectedWindow:'',status:'expected',wallet:'mbank',type:'extra',note:''};showModal(isNew?'Νέο έσοδο':'Επεξεργασία εσόδου',`<div class="form-grid"><div class="field"><label>Περιγραφή</label><input name="name" required value="${esc(i.name)}" placeholder="π.χ. Κέρδος / Δώρο / Επιστροφή"></div><div class="field"><label>Ποσό</label><input name="amount" type="number" step="0.01" required value="${i.amount}"></div><div class="field"><label>Πότε αναμένεται</label><input name="expectedWindow" value="${esc(i.expectedWindow||'')}"></div><div class="field"><label>Κατάσταση</label><select name="status"><option value="expected" ${i.status==='expected'?'selected':''}>Αναμένεται</option><option value="received" ${i.status==='received'?'selected':''}>Μπήκε</option></select></div><div class="field" style="grid-column:1/-1"><label>Πού μπήκε</label><select name="wallet">${walletOptions(i.wallet)}</select></div><div class="field" style="grid-column:1/-1"><label>Σχόλιο / από πού προήλθε</label><textarea name="note" placeholder="π.χ. κέρδος από στοίχημα, δώρο γενεθλίων, πώληση αντικειμένου...">${esc(i.note||'')}</textarea></div></div>`,fd=>{
   const oldStatus=i.status,oldAmt=Number(i.amount||0),oldWallet=i.wallet; const newStatus=fd.get('status'),newAmt=Number(fd.get('amount')||0),newWallet=fd.get('wallet');
   if(!isNew&&i.posted&&oldStatus==='received'){wallet(oldWallet).balance-=oldAmt;i.posted=false}
   Object.assign(i,{name:fd.get('name'),amount:newAmt,expectedWindow:fd.get('expectedWindow'),status:newStatus,wallet:newWallet,note:fd.get('note')||''});
   if(newStatus==='received'&&!i.posted){wallet(newWallet).balance+=newAmt;i.posted=true;state.activity.push({date:today,label:`Έσοδο: ${i.name}`,amount:newAmt})}
   if(newStatus!=='received')i.posted=false;
   if(isNew)state.incomes.push(i);
 })}

function editExpense(e){const isNew=!e;e=e||{id:'e'+Date.now(),name:'',planned:0,actual:0,status:'pending',category:'Άλλο',recurring:'once',issueDate:today,due:'',paidDate:'',wallet:'mbank'};showModal(isNew?'Νέο έξοδο':'Επεξεργασία εξόδου',`<div class="form-grid"><div class="field"><label>Περιγραφή</label><input name="name" required value="${esc(e.name)}"></div><div class="field"><label>Ποσό</label><input name="actual" type="number" step="0.01" required value="${e.actual||e.planned||0}"></div><div class="field"><label>Κατηγορία</label><input name="category" value="${esc(e.category||'Άλλο')}"></div><div class="field"><label>Ημερομηνία έκδοσης / εξόδου</label><input name="issueDate" type="date" value="${e.issueDate||''}"></div><div class="field"><label>Ημερομηνία λήξης</label><input name="due" type="date" value="${e.due||''}"></div><div class="field"><label>Ημερομηνία πληρωμής</label><input name="paidDate" type="date" value="${e.paidDate||''}"></div><div class="field"><label>Κατάσταση</label><select name="status"><option value="pending" ${e.status==='pending'?'selected':''}>Εκκρεμεί</option><option value="paid" ${e.status==='paid'?'selected':''}>Πληρώθηκε</option><option value="inactive" ${e.status==='inactive'?'selected':''}>Δεν έχει έρθει ακόμα</option></select></div><div class="field"><label>Πληρωμή από</label><select name="wallet">${walletOptions(e.wallet||'mbank')}</select></div><div class="field" style="grid-column:1/-1"><label>Σημείωση</label><textarea name="note" placeholder="π.χ. λογαριασμός Σεπτεμβρίου / αγορά για σπίτι">${esc(e.note||'')}</textarea></div></div><div class="notice" style="margin-top:12px">Αν το σημειώσεις «Πληρώθηκε» και αφήσεις κενή την ημερομηνία πληρωμής, θα μπει αυτόματα η σημερινή ημερομηνία.</div>`,fd=>{
   const oldStatus=e.status,oldAmt=Number(e.actual||0),oldWallet=e.wallet;
   if(!isNew&&e.posted&&oldStatus==='paid'){const ow=wallet(oldWallet);if(ow)ow.balance+=oldAmt;e.posted=false}
   const status=fd.get('status');
   let paidDate=fd.get('paidDate')||'';
   if(status==='paid'&&!paidDate)paidDate=today;
   if(status!=='paid')paidDate='';
   Object.assign(e,{name:fd.get('name'),actual:Number(fd.get('actual')||0),planned:isNew?Number(fd.get('actual')||0):e.planned,category:fd.get('category'),issueDate:fd.get('issueDate')||'',due:fd.get('due')||'',paidDate,status,wallet:fd.get('wallet'),note:fd.get('note')||''});
   if(e.status==='paid'&&!e.posted){const payWallet=wallet(e.wallet)||wallet('mbank');if(payWallet){payWallet.balance-=e.actual;e.wallet=payWallet.id}e.posted=true;state.activity.push({date:e.paidDate||today,label:`Έξοδο: ${e.name}`,amount:-e.actual})}
   if(e.status!=='paid')e.posted=false;
   if(isNew)state.expenses.push(e);
 })}
function adjustWallet(id){const w=wallet(id);showModal('Διόρθωση υπολοίπου',`<div class="notice">Γράψε το πραγματικό ποσό που βλέπεις τώρα. Η διαφορά θα καταγραφεί ως διόρθωση ώστε το app να συμφωνεί με την πραγματικότητα.</div><div class="field" style="margin-top:14px"><label>${esc(w.owner)} · ${esc(w.name)}</label><input name="balance" type="number" step="0.01" value="${w.balance}" required></div><div class="field" style="margin-top:12px"><label>Σημείωση (προαιρετικό)</label><input name="note" placeholder="π.χ. χειροκίνητος έλεγχος τράπεζας"></div>`,fd=>{const next=Number(fd.get('balance')||0),diff=next-w.balance;w.balance=next;state.activity.push({date:today,label:`Διόρθωση ${w.owner} · ${w.name}${fd.get('note')?' — '+fd.get('note'):''}`,amount:diff})})}
function setupBalances(){showModal('Αρχικά / τρέχοντα υπόλοιπα',`<div class="notice">Βάλε ό,τι έχετε αυτή τη στιγμή. Τα λεφτά της «Άκρης» μένουν ξεχωριστά.</div><div class="form-grid" style="margin-top:14px">${state.wallets.map(w=>`<div class="field"><label>${esc(w.owner)} · ${esc(w.name)}</label><input name="${w.id}" type="number" step="0.01" value="${w.balance}"></div>`).join('')}<div class="field"><label>Στην άκρη</label><input name="savings" type="number" step="0.01" value="${state.savings}"></div></div>`,fd=>{state.wallets.forEach(w=>w.balance=Number(fd.get(w.id)||0));state.savings=Number(fd.get('savings')||0)})}
function initialSetup(){const active=state.expenses.filter(e=>e.status!=='inactive');showModal('Αρχική κατάσταση τρέχοντος μήνα',`<div class="notice"><strong>Μία φορά στην αρχή.</strong> Βάζεις τα πραγματικά σημερινά υπόλοιπα και σημειώνεις τι έχει ήδη συμβεί. Τα τσεκαρισμένα έσοδα/έξοδα θεωρούνται ήδη μέσα στα υπόλοιπα που γράφεις, άρα δεν θα προστεθούν ή αφαιρεθούν ξανά.</div><h3 class="setup-title">1. Τι έχετε τώρα</h3><div class="form-grid">${state.wallets.map(w=>`<div class="field"><label>${esc(w.owner)} · ${esc(w.name)}</label><input name="wallet_${w.id}" type="number" step="0.01" value="${w.balance}"></div>`).join('')}<div class="field"><label>Στην άκρη</label><input name="setup_savings" type="number" step="0.01" value="${state.savings}"></div><div class="field"><label>Προσωπικά Μάνου</label><input name="personal_manos" type="number" step="0.01" value="${state.personal.manos.balance}"></div><div class="field"><label>Προσωπικά Πένυς</label><input name="personal_penny" type="number" step="0.01" value="${state.personal.penny.balance}"></div></div><h3 class="setup-title">2. Έσοδα που έχουν ήδη μπει</h3><div class="setup-list">${state.incomes.map(i=>`<label class="setup-item"><input type="checkbox" name="recv_${i.id}" ${i.status==='received'?'checked':''}><span><strong>${esc(i.name)}</strong><small>Πραγματικό ποσό</small></span><input class="setup-amount" name="incamt_${i.id}" type="number" step="0.01" value="${i.amount}"></label>`).join('')}</div><h3 class="setup-title">3. Πάγια που έχουν ήδη πληρωθεί</h3><div class="setup-list">${active.map(e=>`<label class="setup-item"><input type="checkbox" name="paid_${e.id}" ${e.status==='paid'?'checked':''}><span><strong>${esc(e.name)}</strong><small>Πραγματικό ποσό</small></span><input class="setup-amount" name="expamt_${e.id}" type="number" step="0.01" value="${e.actual||e.planned||0}"></label>`).join('')}</div><div class="warning notice" style="margin-top:14px">ΔΕΗ, ΕΥΔΑΠ και κοινόχρηστα που δεν έχουν έρθει ακόμα τα αφήνεις όπως είναι και τα καταχωρείς όταν εμφανιστούν.</div>`,fd=>{state.wallets.forEach(w=>w.balance=Number(fd.get('wallet_'+w.id)||0));state.savings=Number(fd.get('setup_savings')||0);state.personal.manos.balance=Number(fd.get('personal_manos')||0);state.personal.penny.balance=Number(fd.get('personal_penny')||0);state.incomes.forEach(i=>{i.amount=Number(fd.get('incamt_'+i.id)||i.amount||0);const received=fd.has('recv_'+i.id);i.status=received?'received':'expected';i.posted=received});active.forEach(e=>{e.actual=Number(fd.get('expamt_'+e.id)||e.actual||e.planned||0);const paid=fd.has('paid_'+e.id);e.status=paid?'paid':'pending';e.posted=paid});state.setupComplete=true;state.activity.push({date:today,label:'Ολοκληρώθηκε η αρχική κατάσταση',amount:0})},'Αποθήκευση αρχικής κατάστασης')}
function editAllocation(){const rem=forecastMonth();if(rem<=0)return alert('Δεν υπάρχει θετικό υπόλοιπο για μοίρασμα αυτή τη στιγμή.');const a=state.allocation||{savings:0,other:0,otherLabel:'Άλλο / ελεύθερα'};showModal('Μοίρασμα υπολοίπου',`<div class="notice">Μετά από όλα τα έσοδα και τα προγραμματισμένα έξοδα μένουν <strong>${euro(rem)}</strong>. Διάλεξε πόσα θέλετε να προγραμματίσετε για την άκρη και πόσα για κάτι άλλο.</div><div class="form-grid" style="margin-top:14px"><div class="field"><label>Στην άκρη</label><input name="saveAmount" type="number" min="0" step="0.01" value="${a.savings||0}"></div><div class="field"><label>Για άλλο / ελεύθερα</label><input name="otherAmount" type="number" min="0" step="0.01" value="${a.other||0}"></div><div class="field" style="grid-column:1/-1"><label>Πώς να το ονομάσουμε</label><input name="otherLabel" value="${esc(a.otherLabel||'Άλλο / ελεύθερα')}" placeholder="π.χ. αγορά για σπίτι / βόλτες / ελεύθερα"></div></div><div class="mini muted" style="margin-top:10px">Αν αφήσεις μέρος αδιάθετο, θα παραμείνει ως διαθέσιμο υπόλοιπο του μήνα.</div>`,fd=>{const sav=Math.max(0,Number(fd.get('saveAmount')||0)),other=Math.max(0,Number(fd.get('otherAmount')||0));if(sav+other>rem+0.001)return alert(`Το μοίρασμα είναι ${euro(sav+other)}, αλλά το διαθέσιμο υπόλοιπο είναι ${euro(rem)}.`),false;state.allocation={savings:sav,other,otherLabel:fd.get('otherLabel')||'Άλλο / ελεύθερα'}})}

function addCard(){showModal('Έκτακτη χρήση πιστωτικής',`<div class="form-grid"><div class="field"><label>Περιγραφή</label><input name="label" required placeholder="π.χ. αγορά για σπίτι"></div><div class="field"><label>Ποσό</label><input name="amount" type="number" step="0.01" required></div><div class="field"><label>Ημερομηνία</label><input name="date" type="date" value="${today}"></div></div><div class="warning notice" style="margin-top:12px">Θα θεωρηθεί δεσμευμένο έξοδο του τρέχοντος κύκλου μέχρι να εξοφληθεί.</div>`,fd=>state.cardExtra.push({label:fd.get('label'),amount:Number(fd.get('amount')||0),date:fd.get('date'),status:'pending'}))}
function savingsMove(sign){showModal(sign>0?'Κατάθεση στην άκρη':'Ανάληψη από την άκρη',`<div class="form-grid"><div class="field"><label>Ποσό</label><input name="amount" type="number" step="0.01" required></div><div class="field"><label>${sign>0?'Από πού':'Πού θα μπουν'}</label><select name="wallet">${walletOptions('mbank')}</select></div><div class="field" style="grid-column:1/-1"><label>Αιτιολογία</label><input name="label" required placeholder="π.χ. περίσσευμα μήνα / έκτακτο έξοδο"></div></div>`,fd=>{const amt=Number(fd.get('amount')||0)*sign,w=wallet(fd.get('wallet'));if(sign>0&&w.balance<Math.abs(amt))return alert('Το συγκεκριμένο πορτοφόλι δεν έχει αρκετό διαθέσιμο υπόλοιπο.'),false;if(sign<0&&state.savings<Math.abs(amt))return alert('Δεν υπάρχουν αρκετά χρήματα στην άκρη.'),false;state.savings+=amt;w.balance-=amt;state.savingsTx.push({date:today,amount:amt,label:fd.get('label'),wallet:w.id})})}
function personalMove(person,sign){const p=state.personal[person];showModal(`${sign>0?'Έσοδο':'Έξοδο'} · ${p.name}`,`<div class="form-grid"><div class="field"><label>Ποσό</label><input name="amount" type="number" step="0.01" required></div><div class="field"><label>Περιγραφή</label><input name="label" required placeholder="${sign>0?'π.χ. Κέρδος':'π.χ. Στοίχημα / Αγορά'}"></div><div class="field" style="grid-column:1/-1"><label>Σχόλιο / λόγος (προαιρετικό)</label><textarea name="note" placeholder="${sign>0?'π.χ. κέρδος από στοίχημα Ολυμπιακός - Ρεάλ':'π.χ. αγορά ακουστικών'}"></textarea></div></div>`,fd=>{const amt=Math.abs(Number(fd.get('amount')||0))*sign;if(sign<0&&p.balance<Math.abs(amt))return alert('Το προσωπικό υπόλοιπο δεν επαρκεί.'),false;p.balance+=amt;p.transactions.push({date:today,amount:amt,label:fd.get('label'),note:fd.get('note')||''})})}
function personalTransfer(person){const p=state.personal[person];showModal(`Μεταφορά από ${p.name} στο κοινό`, `<div class="form-grid"><div class="field"><label>Ποσό</label><input name="amount" type="number" step="0.01" required></div><div class="field"><label>Προορισμός</label><select name="dest"><option value="savings">Στην άκρη</option><option value="wallet">Κοινά μετρητά σπιτιού</option></select></div><div class="field" style="grid-column:1/-1"><label>Σημείωση</label><input name="label" value="Μεταφορά στο κοινό"></div></div>`,fd=>{const amt=Number(fd.get('amount')||0);if(amt>p.balance)return alert('Το προσωπικό υπόλοιπο δεν επαρκεί.'),false;p.balance-=amt;p.transactions.push({date:today,amount:-amt,label:fd.get('label')});if(fd.get('dest')==='savings'){state.savings+=amt;state.savingsTx.push({date:today,amount:amt,label:`Από προσωπικό ${p.name}`,wallet:'homecash'})}else wallet('homecash').balance+=amt})}
function quickAdd(){showModal('Γρήγορη προσθήκη',`<div class="grid grid-2"><button type="button" class="btn" onclick="document.getElementById('modal').close();setTimeout(()=>action('add-income'),0)">＋ Έσοδο</button><button type="button" class="btn red" onclick="document.getElementById('modal').close();setTimeout(()=>action('add-expense'),0)">− Έξοδο</button><button type="button" class="btn secondary" onclick="document.getElementById('modal').close();setTimeout(()=>action('savings-deposit'),0)">＋ Στην άκρη</button><button type="button" class="btn secondary" onclick="document.getElementById('modal').close();setTimeout(()=>action('setup-balances'),0)">Διόρθωση υπολοίπων</button></div>`,()=>false,'Κλείσιμο')}

render();

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('./sw.js');
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            const ok = confirm('Υπάρχει νέα έκδοση της εφαρμογής. Να γίνει ενημέρωση τώρα;');
            if (ok) nw.postMessage({type:'SKIP_WAITING'});
          }
        });
      });
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        location.reload();
      });
    } catch (e) { console.warn('SW registration failed', e); }
  });
}
</script>
